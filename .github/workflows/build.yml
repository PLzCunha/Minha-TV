name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Montar projeto Android
        run: |
          set -e
          HTML=$(grep -l "window.Android" *.html | head -1)
          test -n "$HTML" || { echo "Envie o HTML novo (iptv-netflix.html) para o repositório"; exit 1; }
          mkdir -p proj/app/src/main/assets proj/app/src/main/java/com/nicotv/app proj/app/src/main/res/drawable-nodpi
          cp "$HTML" proj/app/src/main/assets/index.html
          cp nico-icon.png proj/app/src/main/res/drawable-nodpi/nico_icon.png
          cp nico-banner.png proj/app/src/main/res/drawable-nodpi/nico_banner.png
          cd proj
          cat > settings.gradle <<'SETTINGS'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          include ':app'
          SETTINGS
          cat > build.gradle <<'ROOTBUILD'
          plugins { id 'com.android.application' version '8.3.2' apply false }
          ROOTBUILD
          cat > gradle.properties <<'PROPS'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          PROPS
          cat > app/build.gradle <<'APPBUILD'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.nicotv.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.nicotv.app'
              minSdk 21
              targetSdk 33
              versionCode 11
              versionName '1.3.11'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_1_8
              targetCompatibility JavaVersion.VERSION_1_8
            }
          }
          dependencies {
            implementation 'androidx.media3:media3-exoplayer:1.3.1'
            implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
            implementation 'androidx.media3:media3-ui:1.3.1'
          }
          APPBUILD
          cat > app/src/main/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
            <uses-feature android:name="android.software.leanback" android:required="false"/>
            <application android:label="Nico TV" android:icon="@drawable/nico_icon" android:banner="@drawable/nico_banner" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                </intent-filter>
              </activity>
              <activity android:name=".PlayerActivity" android:exported="false" android:configChanges="orientation|screenSize|keyboardHidden"/>
            </application>
          </manifest>
          MANIFEST
          cat > app/src/main/java/com/nicotv/app/MainActivity.java <<'MAINACTIVITY'
          package com.nicotv.app;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.IOException;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          public class MainActivity extends Activity {
            WebView w;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              w.setBackgroundColor(0xFF0A0E14);
              w.setWebViewClient(new WebViewClient());
              w.addJavascriptInterface(new Bridge(), "Android");
              w.loadUrl("file:///android_asset/index.html");
            }
            class Bridge {
              @JavascriptInterface public void get(final String u, final String cb) {
                new Thread(() -> {
                  String res; boolean ok = true;
                  try { res = fetch(u, 0); } catch (Exception e) { ok = false; res = String.valueOf(e.getMessage()); }
                  final String js = "window['" + cb + "']&&window['" + cb + "'](" + ok + "," + JSONObject.quote(res) + ")";
                  runOnUiThread(() -> w.evaluateJavascript(js, null));
                }).start();
              }
              @JavascriptInterface public void playVod(String json, int i) {
                Intent t = new Intent(MainActivity.this, PlayerActivity.class);
                t.putExtra("list", json);
                t.putExtra("i", i);
                t.putExtra("vod", true);
                startActivity(t);
              }
              @JavascriptInterface public void playEpisodes(String json, int i) {
                Intent t = new Intent(MainActivity.this, PlayerActivity.class);
                t.putExtra("list", json);
                t.putExtra("i", i);
                t.putExtra("vod", true);
                t.putExtra("episodes", true);
                startActivity(t);
              }
              @JavascriptInterface public void play(String json, int i) {
                Intent t = new Intent(MainActivity.this, PlayerActivity.class);
                t.putExtra("list", json);
                t.putExtra("i", i);
                startActivity(t);
              }
            }
            String fetch(String u, int n) throws Exception {
              HttpURLConnection c = (HttpURLConnection) new URL(u).openConnection();
              c.setInstanceFollowRedirects(false);
              c.setConnectTimeout(15000);
              c.setReadTimeout(60000);
              c.setRequestProperty("User-Agent", "NicoTV/1.2 (Android)");
              int code = c.getResponseCode();
              if (code >= 300 && code < 400 && n < 5) {
                String l = c.getHeaderField("Location");
                if (l != null) return fetch(new URL(new URL(u), l).toString(), n + 1);
              }
              if (code >= 400) throw new IOException("HTTP " + code);
              BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream(), "UTF-8"));
              StringBuilder sb = new StringBuilder();
              char[] buf = new char[16384];
              int k;
              while ((k = r.read(buf)) > 0) sb.append(buf, 0, k);
              r.close();
              return sb.toString();
            }
            @Override public void onBackPressed() {
              w.evaluateJavascript("(window.__back&&window.__back())?'1':'0'", v -> { if (!"\"1\"".equals(v)) finish(); });
            }
          }
          MAINACTIVITY
          cat > app/src/main/java/com/nicotv/app/PlayerActivity.java <<'PLAYERACTIVITY'
          package com.nicotv.app;
          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.WindowManager;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.content.SharedPreferences;
          import android.widget.TextView;
          import android.view.View;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.PlaybackException;
          import androidx.media3.common.Player;
          import androidx.media3.datasource.DefaultHttpDataSource;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory;
          import androidx.media3.ui.PlayerView;
          import org.json.JSONArray;
          public class PlayerActivity extends Activity {
            ExoPlayer p; PlayerView pv; TextView title; TextView status; TextView footer; JSONArray list; int i; boolean vod; boolean episodes; LinearLayout controls; TextView playControl; TextView nextControl; TextView nextPrompt; Runnable autoNext; int countDown; SeekBar timeline; TextView elapsed; TextView durationLabel; LinearLayout timelineBox; boolean seekingTimeline=false; String mediaKey=null; long lastPositionSave=0;
            FrameLayout panel; ScrollView panelScroll; LinearLayout panelRows; boolean panelVisible = false; int selection = 0;
            Handler h = new Handler();
            Runnable hide = () -> { title.setVisibility(android.view.View.INVISIBLE); footer.setVisibility(android.view.View.INVISIBLE); };
            Runnable progressTick = new Runnable() { @Override public void run() {
              if(p == null)return;
              refreshTimeline();savePosition(false);
              h.postDelayed(this,1000);
            }};
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              FrameLayout root = new FrameLayout(this);
              root.setBackgroundColor(Color.BLACK);
              pv = new PlayerView(this);
              pv.setUseController(false);
              root.addView(pv);

              title = new TextView(this);
              title.setTextColor(Color.WHITE);
              title.setTextSize(24);
              title.setBackgroundColor(0xAA000000);
              title.setPadding(34, 22, 34, 22);
              root.addView(title, new FrameLayout.LayoutParams(-1, -2, Gravity.TOP));

              footer = new TextView(this);
              footer.setTextColor(0xFFE6F0F6);
              footer.setTextSize(15);
              footer.setBackgroundColor(0xBB0C2235);
              footer.setPadding(28, 16, 28, 16);
              FrameLayout.LayoutParams fp = new FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM|Gravity.CENTER_HORIZONTAL);
              fp.bottomMargin = 88;
              root.addView(footer, fp);
              footer.setVisibility(android.view.View.INVISIBLE);

              timelineBox = new LinearLayout(this);
              timelineBox.setOrientation(LinearLayout.VERTICAL);
              timelineBox.setPadding(dp(24),dp(10),dp(24),dp(5));
              timelineBox.setBackgroundColor(0xE5111B29);
              FrameLayout.LayoutParams tlp = new FrameLayout.LayoutParams(-1,-2,Gravity.BOTTOM);
              tlp.bottomMargin = dp(75);
              root.addView(timelineBox,tlp);
              timeline = new SeekBar(this);
              timeline.setMax(1000);
              timeline.setProgressTintList(android.content.res.ColorStateList.valueOf(0xFFE4C16D));
              timeline.setThumbTintList(android.content.res.ColorStateList.valueOf(0xFFE4C16D));
              timelineBox.addView(timeline,new LinearLayout.LayoutParams(-1,dp(30)));
              LinearLayout timeRow = new LinearLayout(this);
              timeRow.setGravity(Gravity.CENTER_VERTICAL);
              elapsed = new TextView(this);durationLabel=new TextView(this);
              elapsed.setTextColor(0xFFE4C16D);durationLabel.setTextColor(Color.WHITE);
              elapsed.setTextSize(15);durationLabel.setTextSize(15);
              timeRow.addView(elapsed,new LinearLayout.LayoutParams(0,-2,1));
              timeRow.addView(durationLabel);
              timelineBox.addView(timeRow);
              timelineBox.setVisibility(View.GONE);
              timeline.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener(){
                @Override public void onStartTrackingTouch(SeekBar bar){seekingTimeline=true;}
                @Override public void onProgressChanged(SeekBar bar,int value,boolean fromUser){
                  if(fromUser&&p!=null&&vod&&p.isCurrentMediaItemSeekable()&&p.getDuration()>0){
                    long target=p.getDuration()*value/1000L;elapsed.setText(tm(target));
                  }
                }
                @Override public void onStopTrackingTouch(SeekBar bar){
                  if(p!=null&&vod&&p.isCurrentMediaItemSeekable()&&p.getDuration()>0)p.seekTo(p.getDuration()*bar.getProgress()/1000L);
                  seekingTimeline=false;savePosition(true);refreshTimeline();
                }
              });

              controls = new LinearLayout(this);
              controls.setOrientation(LinearLayout.HORIZONTAL);
              controls.setGravity(Gravity.CENTER);
              controls.setPadding(dp(8),dp(10),dp(8),dp(10));
              controls.setBackgroundColor(0xD9111B29);
              FrameLayout.LayoutParams cp = new FrameLayout.LayoutParams(-1,-2,Gravity.BOTTOM);
              root.addView(controls,cp);
              addControl(controls,"← Voltar", () -> finish());
              addControl(controls,"↶ 10s", () -> seekSeconds(-10));
              playControl = addControl(controls,"Ⅱ Pausar", () -> togglePlay());
              addControl(controls,"10s ↷", () -> seekSeconds(10));
              nextControl = addControl(controls,"Próximo ▶", () -> nextEpisode());
              nextControl.setVisibility(View.GONE);

              nextPrompt = new TextView(this);
              nextPrompt.setBackgroundColor(0xF20E1826);
              nextPrompt.setTextColor(0xFFFFE1A1);
              nextPrompt.setTextSize(17);
              nextPrompt.setGravity(Gravity.CENTER);
              nextPrompt.setPadding(dp(22),dp(18),dp(22),dp(18));
              FrameLayout.LayoutParams np = new FrameLayout.LayoutParams(dp(430),-2,Gravity.RIGHT|Gravity.BOTTOM);
              np.bottomMargin=dp(95);np.rightMargin=dp(24);
              root.addView(nextPrompt,np);
              nextPrompt.setVisibility(View.GONE);
              nextPrompt.setOnClickListener(v -> nextEpisode());

              status = new TextView(this);
              status.setTextColor(0xFFE0F6FF);
              status.setTextSize(18);
              status.setBackgroundColor(0xBB0C2235);
              status.setPadding(24, 18, 24, 18);
              FrameLayout.LayoutParams sp = new FrameLayout.LayoutParams(-2, -2, Gravity.CENTER);
              root.addView(status, sp);
              status.setVisibility(android.view.View.GONE);

              panel = new FrameLayout(this);
              panel.setBackgroundColor(0xF20B1220);
              FrameLayout.LayoutParams panelParams = new FrameLayout.LayoutParams(dp(340), -1, Gravity.RIGHT);
              root.addView(panel, panelParams);
              panelScroll = new ScrollView(this);
              panelRows = new LinearLayout(this);
              panelRows.setOrientation(LinearLayout.VERTICAL);
              panelRows.setPadding(dp(16), dp(72), dp(16), dp(24));
              panelScroll.addView(panelRows);
              panel.addView(panelScroll, new FrameLayout.LayoutParams(-1, -1));
              panel.setVisibility(android.view.View.GONE);
              setContentView(root);

              try {
                list = new JSONArray(getIntent().getStringExtra("list"));
                i = getIntent().getIntExtra("i", 0);
                vod = getIntent().getBooleanExtra("vod", false);
                episodes = getIntent().getBooleanExtra("episodes", false);
              } catch (Exception e) { finish(); return; }

              DefaultHttpDataSource.Factory df = new DefaultHttpDataSource.Factory()
                .setUserAgent("NicoTV/1.2 (Android)")
                .setAllowCrossProtocolRedirects(true);
              p = new ExoPlayer.Builder(this).setMediaSourceFactory(new DefaultMediaSourceFactory(df)).build();
              pv.setPlayer(p);
              p.addListener(new Player.Listener() {
                @Override public void onPlayerError(PlaybackException e) {
                  status.setText("Não foi possível reproduzir.\nPressione OK para tentar novamente ou ↑ ↓ para trocar.");
                  status.setVisibility(android.view.View.VISIBLE);
                  show(nm());
                }
                @Override public void onPlaybackStateChanged(int state) {
                  if (state == Player.STATE_BUFFERING) {
                    status.setText("Carregando transmissão…");
                    status.setVisibility(android.view.View.VISIBLE);
                  } else if (state == Player.STATE_READY) {
                    status.setVisibility(android.view.View.GONE);
                    if(p.getCurrentPosition()<1500)restorePosition();
                    refreshTimeline();
                  } else if (state == Player.STATE_ENDED && episodes) {
                    clearPosition();offerNext();
                  } else if (state == Player.STATE_ENDED && !vod) {
                    status.setText("Transmissão encerrada. Pressione OK para tentar novamente.");
                    status.setVisibility(android.view.View.VISIBLE);
                  }
                }
                @Override public void onIsPlayingChanged(boolean playing) {
                  if (playControl != null) playControl.setText(playing ? "Ⅱ Pausar" : "▶ Play");
                }
              });
              go(0);
              h.post(progressTick);
            }
            int dp(int x) { return (int) (x * getResources().getDisplayMetrics().density + 0.5f); }
            TextView addControl(LinearLayout row, String label, Runnable action) {
              TextView b = new TextView(this);
              b.setText(label); b.setTextColor(0xFFFFF0CC); b.setTextSize(16);
              b.setGravity(Gravity.CENTER); b.setFocusable(true);
              b.setPadding(dp(12),dp(12),dp(12),dp(12));
              b.setBackgroundColor(0xFF233047);
              LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0,dp(55),1);
              lp.setMargins(dp(4),0,dp(4),0);
              row.addView(b,lp);
              b.setOnClickListener(v -> action.run());
              return b;
            }
            String currentMediaKey(){
              try{return "vod_"+Integer.toHexString(list.getJSONArray(i).getString(1).hashCode());}
              catch(Exception e){return null;}
            }
            SharedPreferences positions(){return getSharedPreferences("nico_resume_v1",MODE_PRIVATE);}
            void savePosition(boolean force){
              if(!vod||p==null||mediaKey==null)return;
              if(!force && android.os.SystemClock.elapsedRealtime()-lastPositionSave < 5000)return;
              lastPositionSave=android.os.SystemClock.elapsedRealtime();
              long d=p.getDuration(),pos=p.getCurrentPosition();
              if(d<=0||pos<0||d==androidx.media3.common.C.TIME_UNSET)return;
              if(p.getPlaybackState()==Player.STATE_ENDED||pos>=d-8000){positions().edit().remove(mediaKey).apply();return;}
              if(pos>3000)positions().edit().putLong(mediaKey,pos).apply();
            }
            void clearPosition(){if(mediaKey!=null)positions().edit().remove(mediaKey).apply();}
            void restorePosition(){
              if(!vod||p==null||mediaKey==null||!p.isCurrentMediaItemSeekable())return;
              long d=p.getDuration(),pos=positions().getLong(mediaKey,0);
              if(d>0&&pos>5000&&pos<d-12000){p.seekTo(pos);show(nm()+"  •  Retomando de "+tm(pos));}
            }
            void refreshTimeline(){
              if(p==null||timelineBox==null)return;
              long d=p.getDuration(),pos=p.getCurrentPosition();
              boolean visible=vod&&d>0&&d!=androidx.media3.common.C.TIME_UNSET;
              timelineBox.setVisibility(visible?View.VISIBLE:View.GONE);
              if(!visible)return;
              timeline.setEnabled(p.isCurrentMediaItemSeekable());
              if(!seekingTimeline)timeline.setProgress((int)Math.min(1000,Math.max(0,(pos*1000L)/d)));
              elapsed.setText(tm(pos));
              durationLabel.setText("Restante "+tm(Math.max(0,d-pos))+"    /    "+tm(d));
            }
            void cancelNext() {
              if(autoNext!=null){h.removeCallbacks(autoNext);autoNext=null;}
              if(nextPrompt!=null)nextPrompt.setVisibility(View.GONE);
            }
            void nextEpisode(){ if(episodes && i<list.length()-1){clearPosition();go(1);} }
            void offerNext(){
              cancelNext();
              if(!episodes||i>=list.length()-1)return;
              countDown=8;
              final int fromIndex=i;
              autoNext=new Runnable(){
                public void run(){
                  if(p==null||i!=fromIndex){cancelNext();return;}
                  nextPrompt.setText("Próximo episódio: " + list.optJSONArray(i+1).optString(0) + "\nReprodução automática em " + countDown + "s\nToque ou pressione → para assistir agora");
                  nextPrompt.setVisibility(View.VISIBLE);
                  if(countDown-- <= 0){nextEpisode();return;}
                  h.postDelayed(this,1000);
                }
              };
              h.post(autoNext);
            }
            void togglePlay(){if(p==null)return; if(p.isPlaying())p.pause();else p.play();show(nm());}
            void seekSeconds(int secs){
              if(!vod||p==null||!p.isCurrentMediaItemSeekable())return;
              long duration=p.getDuration();
              long dest=Math.max(0,p.getCurrentPosition()+secs*1000L);
              if(duration>0)dest=Math.min(dest,duration);
              p.seekTo(dest);show(nm());
            }
            void go(int d) {
              savePosition(true);cancelNext();
              try {
                i = (i + d + list.length()) % list.length();
                JSONArray c = list.getJSONArray(i);
                mediaKey = vod ? currentMediaKey() : null;
                timelineBox.setVisibility(View.GONE);
                p.setMediaItem(MediaItem.fromUri(c.getString(1)));
                status.setText("Carregando transmissão…");
                status.setVisibility(android.view.View.VISIBLE);
                p.prepare();
                p.play();
                show(c.getString(0));
                nextControl.setVisibility(episodes && i < list.length()-1 ? View.VISIBLE : View.GONE);
                if (panelVisible) { selection = i; drawChannels(); }
              } catch (Exception e) { }
            }
            void drawChannels() {
              if (list == null || list.length() == 0) return;
              panelRows.removeAllViews();
              TextView heading = new TextView(this);
              heading.setText("NICO TV  •  CANAIS");
              heading.setTextColor(0xFFE4C16D);
              heading.setTextSize(15);
              heading.setPadding(dp(8), dp(8), dp(8), dp(16));
              panelRows.addView(heading);
              int start = Math.max(0, selection-14);
              int end = Math.min(list.length(), selection+15);
              for (int n = start; n < end; n++) {
                try {
                  JSONArray c = list.getJSONArray(n);
                  TextView entry = new TextView(this);
                  entry.setText((n+1) + "  " + c.getString(0));
                  entry.setTextSize(16);
                  entry.setTextColor(n == selection ? 0xFFFFE5A4 : Color.WHITE);
                  entry.setPadding(dp(14),dp(16),dp(14),dp(16));
                  entry.setBackgroundColor(n == selection ? 0xFF42331A : 0xFF142030);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1,-2);
                  lp.bottomMargin = dp(6);
                  panelRows.addView(entry, lp);
                } catch(Exception ex) {}
              }
              final int focusIndex = selection - start + 1;
              panelScroll.post(() -> {
                if (focusIndex >= 0 && focusIndex < panelRows.getChildCount())
                  panelScroll.scrollTo(0, Math.max(0, panelRows.getChildAt(focusIndex).getTop() - dp(160)));
              });
            }
            void togglePanel(boolean visible) {
              if (vod) return;
              panelVisible = visible;
              panel.setVisibility(visible ? android.view.View.VISIBLE : android.view.View.GONE);
              if (visible) { selection = i; drawChannels(); }
              show(nm());
            }
            void show(String t) {
              title.setText(t + "  •  Nico TV");
              String program = "";
              try { program = list.getJSONArray(i).optString(2, ""); } catch(Exception ex) {}
              footer.setText(vod
                ? "OK pausa/continua  •  ← → avança 10s"
                : (list != null && list.length() > 1
                    ? ("Canal " + (i + 1) + "/" + list.length() + "  •  → lista  •  ↑ ↓ troca" + (program.isEmpty() ? "" : "\n" + program))
                    : "Voltar sai do player"));
              title.setVisibility(android.view.View.VISIBLE);
              footer.setVisibility(android.view.View.VISIBLE);
              h.removeCallbacks(hide);
              h.postDelayed(hide, 3800);
            }
            String nm() { try { return list.getJSONArray(i).getString(0); } catch (Exception x) { return ""; } }
            String tm(long ms) { long s = Math.max(0, ms / 1000); return s >= 3600 ? String.format(java.util.Locale.US,"%d:%02d:%02d",s/3600,(s%3600)/60,s%60) : String.format(java.util.Locale.US,"%02d:%02d", s/60,s%60); }
            @Override public boolean onKeyDown(int k, KeyEvent e) {
              boolean multi = list != null && list.length() > 1;
              if (panelVisible) {
                if (k == KeyEvent.KEYCODE_BACK || k == KeyEvent.KEYCODE_ESCAPE || k == KeyEvent.KEYCODE_DPAD_LEFT) { togglePanel(false); return true; }
                if (k == KeyEvent.KEYCODE_DPAD_UP) { selection = (selection - 1 + list.length()) % list.length(); drawChannels(); return true; }
                if (k == KeyEvent.KEYCODE_DPAD_DOWN) { selection = (selection + 1) % list.length(); drawChannels(); return true; }
                if (k == KeyEvent.KEYCODE_DPAD_CENTER || k == KeyEvent.KEYCODE_ENTER) {
                  int newIndex = selection; togglePanel(false); go(newIndex - i); return true;
                }
                return true;
              }
              if (!vod && k == KeyEvent.KEYCODE_DPAD_RIGHT) { togglePanel(true); return true; }
              if (k == KeyEvent.KEYCODE_DPAD_UP || k == KeyEvent.KEYCODE_CHANNEL_UP) { if (multi) go(-1); return true; }
              if (k == KeyEvent.KEYCODE_DPAD_DOWN || k == KeyEvent.KEYCODE_CHANNEL_DOWN) { if (multi) go(1); return true; }
              if (episodes && nextPrompt.getVisibility()==View.VISIBLE && (k==KeyEvent.KEYCODE_DPAD_RIGHT || k==KeyEvent.KEYCODE_DPAD_CENTER || k==KeyEvent.KEYCODE_ENTER)) {
                nextEpisode(); return true;
              }
              if (vod && (k == KeyEvent.KEYCODE_DPAD_LEFT || k == KeyEvent.KEYCODE_MEDIA_REWIND)) {
                p.seekTo(Math.max(0, p.getCurrentPosition() - 10000));
                show(nm() + "  " + tm(p.getCurrentPosition()) + " / " + tm(p.getDuration()));
                return true;
              }
              if (vod && (k == KeyEvent.KEYCODE_DPAD_RIGHT || k == KeyEvent.KEYCODE_MEDIA_FAST_FORWARD)) {
                p.seekTo(p.getCurrentPosition() + 10000);
                show(nm() + "  " + tm(p.getCurrentPosition()) + " / " + tm(p.getDuration()));
                return true;
              }
              if (k == KeyEvent.KEYCODE_DPAD_CENTER || k == KeyEvent.KEYCODE_ENTER || k == KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE) {
                if (vod) {
                  if (p.isPlaying()) p.pause(); else p.play();
                  show(nm() + "  " + tm(p.getCurrentPosition()) + " / " + tm(p.getDuration()) + (p.getPlayWhenReady() ? "" : "  (pausado)"));
                } else {
                  if (p.getPlaybackState() == Player.STATE_IDLE || p.getPlayerError() != null || p.getPlaybackState() == Player.STATE_ENDED) go(0);
                  else show(nm());
                }
                return true;
              }
              return super.onKeyDown(k, e);
            }
            @Override protected void onStop() {
              super.onStop();
              cancelNext(); h.removeCallbacks(hide);h.removeCallbacks(progressTick);
              savePosition(true);
              if (p != null) { p.release(); p = null; }
              finish();
            }
          }
          PLAYERACTIVITY
      - name: Compilar
        run: cd proj && gradle assembleDebug --no-daemon
      - name: Preparar arquivo
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk nicotv.apk
      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Nico TV ${{ github.run_number }}
          files: nicotv.apk
          make_latest: true
