              } catch (Exception e) { finish(); return; }

              DefaultHttpDataSource.Factory df = new DefaultHttpDataSource.Factory()
                .setUserAgent("NicoTV/1.2 (Android)")
                .setAllowCrossProtocolRedirects(true);
              // 2.7.6: quando o primeiro codec falhar na inicialização,
              // tentar outros decodificadores anunciados pelo Android.
              // Não limita a resolução nem altera URLs de filmes.
              DefaultRenderersFactory renderers = new DefaultRenderersFactory(this)
                .setEnableDecoderFallback(true);
