name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Montar projeto Android
        run: |
          set -e
          HTML=$(grep -l "window.Android" *.html | head -1)
          test -n "$HTML" || { echo "Envie o HTML novo (iptv-netflix.html) para o repositorio"; exit 1; }
          mkdir -p proj/app/src/main/assets proj/app/src/main/java/com/minhatv/app
          cp "$HTML" proj/app/src/main/assets/index.html
          cd proj
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.3.2' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.minhatv.app'
            compileSdk 34
            defaultConfig { applicationId 'com.minhatv.app'; minSdk 21; targetSdk 33; versionCode 1; versionName '1.0' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
          }
          dependencies {
            implementation 'androidx.media3:media3-exoplayer:1.3.1'
            implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
            implementation 'androidx.media3:media3-ui:1.3.1'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
            <uses-feature android:name="android.software.leanback" android:required="false"/>
            <application android:label="Minha TV" android:icon="@android:drawable/sym_def_app_icon" android:banner="@android:drawable/sym_def_app_icon" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                </intent-filter>
              </activity>
              <activity android:name=".PlayerActivity" android:exported="false" android:configChanges="orientation|screenSize|keyboardHidden"/>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/minhatv/app/MainActivity.java <<'EOF'
          package com.minhatv.app;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.IOException;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          public class MainActivity extends Activity {
            WebView w;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              w.setBackgroundColor(0xFF0E1118);
              w.setWebViewClient(new WebViewClient());
              w.addJavascriptInterface(new Bridge(), "Android");
              w.loadUrl("file:///android_asset/index.html");
            }
            class Bridge {
              @JavascriptInterface public void get(final String u, final String cb) {
                new Thread(() -> {
                  String res; boolean ok = true;
                  try { res = fetch(u, 0); } catch (Exception e) { ok = false; res = String.valueOf(e.getMessage()); }
                  final String js = "window['" + cb + "']&&window['" + cb + "'](" + ok + "," + JSONObject.quote(res) + ")";
                  runOnUiThread(() -> w.evaluateJavascript(js, null));
                }).start();
              }
              @JavascriptInterface public void play(String json, int i) {
                Intent t = new Intent(MainActivity.this, PlayerActivity.class);
                t.putExtra("list", json);
                t.putExtra("i", i);
                startActivity(t);
              }
            }
            String fetch(String u, int n) throws Exception {
              HttpURLConnection c = (HttpURLConnection) new URL(u).openConnection();
              c.setInstanceFollowRedirects(false);
              c.setConnectTimeout(15000);
              c.setReadTimeout(60000);
              c.setRequestProperty("User-Agent", "MinhaTV/1.0 (Android)");
              int code = c.getResponseCode();
              if (code >= 300 && code < 400 && n < 5) {
                String l = c.getHeaderField("Location");
                if (l != null) return fetch(new URL(new URL(u), l).toString(), n + 1);
              }
              if (code >= 400) throw new IOException("HTTP " + code);
              BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream(), "UTF-8"));
              StringBuilder sb = new StringBuilder();
              char[] buf = new char[16384];
              int k;
              while ((k = r.read(buf)) > 0) sb.append(buf, 0, k);
              r.close();
              return sb.toString();
            }
            @Override public void onBackPressed() {
              w.evaluateJavascript("(window.__back&&window.__back())?'1':'0'", v -> { if (!"\"1\"".equals(v)) finish(); });
            }
          }
          EOF
          cat > app/src/main/java/com/minhatv/app/PlayerActivity.java <<'EOF'
          package com.minhatv.app;
          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.WindowManager;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.PlaybackException;
          import androidx.media3.common.Player;
          import androidx.media3.datasource.DefaultHttpDataSource;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory;
          import androidx.media3.ui.PlayerView;
          import org.json.JSONArray;
          public class PlayerActivity extends Activity {
            ExoPlayer p; PlayerView pv; TextView title; JSONArray list; int i;
            Handler h = new Handler();
            Runnable hide = () -> title.setVisibility(android.view.View.INVISIBLE);
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              FrameLayout root = new FrameLayout(this);
              root.setBackgroundColor(Color.BLACK);
              pv = new PlayerView(this);
              pv.setUseController(false);
              root.addView(pv);
              title = new TextView(this);
              title.setTextColor(Color.WHITE);
              title.setTextSize(24);
              title.setBackgroundColor(0xAA000000);
              title.setPadding(40, 24, 40, 24);
              root.addView(title, new FrameLayout.LayoutParams(-1, -2, Gravity.TOP));
              setContentView(root);
              try {
                list = new JSONArray(getIntent().getStringExtra("list"));
                i = getIntent().getIntExtra("i", 0);
              } catch (Exception e) { finish(); return; }
              DefaultHttpDataSource.Factory df = new DefaultHttpDataSource.Factory()
                .setUserAgent("MinhaTV/1.0 (Android)").setAllowCrossProtocolRedirects(true);
              p = new ExoPlayer.Builder(this).setMediaSourceFactory(new DefaultMediaSourceFactory(df)).build();
              pv.setPlayer(p);
              p.addListener(new Player.Listener() {
                @Override public void onPlayerError(PlaybackException e) { show("Canal indisponível. Use CIMA ou BAIXO para trocar."); }
              });
              go(0);
            }
            void go(int d) {
              try {
                i = (i + d + list.length()) % list.length();
                JSONArray c = list.getJSONArray(i);
                p.setMediaItem(MediaItem.fromUri(c.getString(1)));
                p.prepare();
                p.play();
                show(c.getString(0));
              } catch (Exception e) { }
            }
            void show(String t) {
              title.setText(t);
              title.setVisibility(android.view.View.VISIBLE);
              h.removeCallbacks(hide);
              h.postDelayed(hide, 3500);
            }
            @Override public boolean onKeyDown(int k, KeyEvent e) {
              if (k == KeyEvent.KEYCODE_DPAD_UP || k == KeyEvent.KEYCODE_CHANNEL_UP) { go(-1); return true; }
              if (k == KeyEvent.KEYCODE_DPAD_DOWN || k == KeyEvent.KEYCODE_CHANNEL_DOWN) { go(1); return true; }
              if (k == KeyEvent.KEYCODE_DPAD_CENTER || k == KeyEvent.KEYCODE_ENTER) {
                try { show(list.getJSONArray(i).getString(0)); } catch (Exception x) { }
                return true;
              }
              return super.onKeyDown(k, e);
            }
            @Override protected void onStop() {
              super.onStop();
              if (p != null) { p.release(); p = null; }
              finish();
            }
          }
          EOF
      - name: Compilar
        run: cd proj && gradle assembleDebug --no-daemon
      - name: Preparar arquivo
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk minhatv.apk
      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Minha TV ${{ github.run_number }}
          files: minhatv.apk
          make_latest: true
