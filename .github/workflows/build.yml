                timelineBox.setBackground(bar);
              }
            }
            void selectControl(int index){
              if(index>=0 && isAvailableControl(index)){
                selectedControl=index;seekBarSelected=false;
              } else selectedControl=-1;
              styleSelectedControl();
              show(nm());
            }
            void moveControl(int direction){
              if(selectedControl<0){selectControl(indexOfControl(playControl));return;}
              int x=selectedControl;
              for(int step=0;step<tvButtons.size();step++){
                x=(x+direction+tvButtons.size())%tvButtons.size();
                if(isAvailableControl(x)){selectControl(x);return;}
              }
            }
            void activateControl(){
              if(isAvailableControl(selectedControl))tvButtonActions.get(selectedControl).run();
            }
            String currentMediaKey(){
              try{return "vod_"+Integer.toHexString(list.getJSONArray(i).getString(1).hashCode());}
              catch(Exception e){return null;}
            }
            SharedPreferences positions(){return getSharedPreferences("nico_resume_v1",MODE_PRIVATE);}
            // Persistência independente do player: acessível pela tela inicial via Bridge.
            android.content.SharedPreferences watchHistory(){return getSharedPreferences("nico_watch_history_v2",MODE_PRIVATE);}
            String historyKey(String url){
              long n=2166136261L;
              for(int j=0;j<url.length();j++){n ^= url.charAt(j);n=(n*16777619L)&0xffffffffL;}
              return "v:"+Long.toHexString(n);
            }
            void recordWatchHistory(long pos,long d,boolean completed){
              if(!vod||d<=0||pos<0||list==null)return;
              try{
                JSONArray c=list.getJSONArray(i);String url=c.getString(1);
                String key=historyKey(url);
                JSONObject entry=new JSONObject();
                entry.put("url",url);entry.put("name",c.optString(0,"Conteúdo"));
                entry.put("kind",c.optString(3,"movie"));entry.put("logo",c.optString(4,""));
                entry.put("seriesName",c.optString(5,""));entry.put("seriesId",c.optString(6,""));
                entry.put("season",c.optString(7,""));entry.put("episode",c.optString(8,""));
                entry.put("position",completed?d/1000L:pos/1000L);
                entry.put("duration",d/1000L);
                entry.put("completed",completed);
                entry.put("percent",completed?100:(int)Math.min(100,Math.max(0,pos*100L/d)));
                entry.put("when",System.currentTimeMillis());
                watchHistory().edit().putString(key,entry.toString()).apply();
              } catch(Exception ignored) { }
            }
            void savePosition(boolean force){
              if(!vod||p==null||mediaKey==null)return;
              if(!force && android.os.SystemClock.elapsedRealtime()-lastPositionSave < 5000)return;
              lastPositionSave=android.os.SystemClock.elapsedRealtime();
              long d=p.getDuration(),pos=p.getCurrentPosition();
              if(d<=0||pos<0||d==androidx.media3.common.C.TIME_UNSET)return;
              boolean complete=p.getPlaybackState()==Player.STATE_ENDED||pos>=d-8000;
              if(pos>3000||complete)recordWatchHistory(pos,d,complete);
              if(complete){positions().edit().remove(mediaKey).apply();return;}
              if(pos>3000)positions().edit().putLong(mediaKey,pos).apply();
            }
            void clearPosition(){if(mediaKey!=null)positions().edit().remove(mediaKey).apply();}
            void restorePosition(){
              if(!vod||p==null||mediaKey==null||!p.isCurrentMediaItemSeekable())return;
              long d=p.getDuration(),pos=positions().getLong(mediaKey,0);
              if(d>0&&pos>5000&&pos<d-12000){p.seekTo(pos);show(nm()+"  •  Retomando de "+tm(pos));}
            }
            void refreshTimeline(){
              if(p==null||timelineBox==null)return;
              long d=p.getDuration(),pos=p.getCurrentPosition();
              boolean visible=vod&&d>0&&d!=androidx.media3.common.C.TIME_UNSET;
              timelineBox.setVisibility(visible && overlayVisible ? View.VISIBLE : View.GONE);
              if(!visible)return;
              timeline.setEnabled(p.isCurrentMediaItemSeekable());
              if(!seekingTimeline)timeline.setProgress((int)Math.min(1000,Math.max(0,(pos*1000L)/d)));
              elapsed.setText(tm(pos));
              durationLabel.setText("Restante "+tm(Math.max(0,d-pos))+"    /    "+tm(d));
            }
            void cancelNext() {
              if(autoNext!=null){h.removeCallbacks(autoNext);autoNext=null;}
              if(nextPrompt!=null)nextPrompt.setVisibility(View.GONE);
            }
            void nextEpisode(){ if(episodes && i<list.length()-1){clearPosition();go(1);} }
            void offerNext(){
              cancelNext();
              if(!episodes||i>=list.length()-1)return;
              countDown=8;
              final int fromIndex=i;
              autoNext=new Runnable(){
                public void run(){
                  if(p==null||i!=fromIndex){cancelNext();return;}
                  nextPrompt.setText("Próximo episódio: " + list.optJSONArray(i+1).optString(0) + "\nReprodução automática em " + countDown + "s\nToque ou pressione → para assistir agora");
                  nextPrompt.setVisibility(View.VISIBLE);
                  if(countDown-- <= 0){nextEpisode();return;}
                  h.postDelayed(this,1000);
                }
              };
              h.post(autoNext);
            }
            void togglePlay(){if(p==null)return; if(p.isPlaying())p.pause();else p.play();show(nm());}
            void seekSeconds(int secs){
              if(!vod||p==null||!p.isCurrentMediaItemSeekable())return;
              long duration=p.getDuration();
              long dest=Math.max(0,p.getCurrentPosition()+secs*1000L);
              if(duration>0)dest=Math.min(dest,duration);
              p.seekTo(dest);show(nm());
            }
            void returnPreviousChannel(){
              if(vod || previousChannel < 0 || previousChannel >= list.length() || previousChannel == i)return;
              go(previousChannel-i);
            }
            void go(int d) {
              resumedCurrentItem=false;
              selectedControl=-1;seekBarSelected=false;
              savePosition(true);cancelNext();
              if(!vod && d != 0)previousChannel=i;
              try {
                i = (i + d + list.length()) % list.length();
                liveTsFallbackTried=false;
                JSONArray c = list.getJSONArray(i);
                mediaKey = vod ? currentMediaKey() : null;
                timelineBox.setVisibility(View.GONE);
                p.setMediaItem(MediaItem.fromUri(c.getString(1)));
                status.setText("Carregando transmissão…");
                status.setVisibility(android.view.View.VISIBLE);
                p.prepare();
                p.play();
                show(c.getString(0));
                nextControl.setVisibility(episodes && i < list.length()-1 ? View.VISIBLE : View.GONE);
                previousControl.setVisibility(!vod && previousChannel>=0 ? View.VISIBLE : View.GONE);
                if (panelVisible) { selection = i; drawChannels(); }
              } catch (Exception e) { }
            }
            void drawChannels() {
              if (list == null || list.length() == 0) return;
              panelRows.removeAllViews();
              TextView heading = new TextView(this);
              heading.setText("NICO TV  •  CANAIS");
              heading.setTextColor(0xFFE4C16D);
              heading.setTextSize(15);
              heading.setPadding(dp(8), dp(8), dp(8), dp(16));
              panelRows.addView(heading);
              int start = Math.max(0, selection-14);
              int end = Math.min(list.length(), selection+15);
              for (int n = start; n < end; n++) {
                try {
                  JSONArray c = list.getJSONArray(n);
                  TextView entry = new TextView(this);
                  String now=c.optString(2, "");
                  entry.setText((n+1) + "  " + c.getString(0) + (now.isEmpty()?"":"\n     " + now));
                  entry.setTextSize(16);
                  entry.setTextColor(n == selection ? 0xFFFFE5A4 : Color.WHITE);
                  entry.setPadding(dp(14),dp(16),dp(14),dp(16));
                  entry.setBackgroundColor(n == selection ? 0xFF42331A : 0xFF142030);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1,-2);
                  lp.bottomMargin = dp(6);
                  panelRows.addView(entry, lp);
                } catch(Exception ex) {}
              }
              final int focusIndex = selection - start + 1;
              panelScroll.post(() -> {
                if (focusIndex >= 0 && focusIndex < panelRows.getChildCount())
                  panelScroll.scrollTo(0, Math.max(0, panelRows.getChildAt(focusIndex).getTop() - dp(160)));
              });
            }
            void togglePanel(boolean visible) {
              if (vod) return;
              panelVisible = visible;
              panel.setVisibility(visible ? android.view.View.VISIBLE : android.view.View.GONE);
              if (visible) { selection = i; drawChannels(); }
              show(nm());
            }
            void show(String t) {
              title.setText(t + "  •  Nico TV");
              String program = "";
              try { program = list.getJSONArray(i).optString(2, ""); } catch(Exception ex) {}
              footer.setText(vod
                ? "OK pausa/continua  •  ↓ controles  •  ← → seleciona botoes  •  ↑ barra"
                : (list != null && list.length() > 1
                    ? ("Canal " + (i + 1) + "/" + list.length() + "  •  → lista  •  ↑ ↓ troca  •  ⇆ anterior" + (program.isEmpty() ? "" : "\n" + program))
                    : "Voltar sai do player"));
              overlayVisible = true;
              title.setVisibility(View.VISIBLE);
              FrameLayout.LayoutParams fLayout=(FrameLayout.LayoutParams) footer.getLayoutParams();
              fLayout.bottomMargin=dp(vod?190:88);
              footer.setLayoutParams(fLayout);
              footer.setVisibility(View.VISIBLE);
              controls.setVisibility(View.VISIBLE);
              refreshTimeline();
              h.removeCallbacks(hide);
              if(p!=null && p.isPlaying() && selectedControl<0 && !seekBarSelected) h.postDelayed(hide, 4500);
              styleSelectedControl();
            }
            String nm() { try { return list.getJSONArray(i).getString(0); } catch (Exception x) { return ""; } }
            String tm(long ms) { long s = Math.max(0, ms / 1000); return s >= 3600 ? String.format(java.util.Locale.US,"%d:%02d:%02d",s/3600,(s%3600)/60,s%60) : String.format(java.util.Locale.US,"%02d:%02d", s/60,s%60); }
            // No Android, um toque real revela o menu. Sem movimento ele permanece oculto.
            @Override public boolean dispatchTouchEvent(MotionEvent e) {
              if (e.getActionMasked() == MotionEvent.ACTION_DOWN && p != null) {
                show(nm());
              }
              return super.dispatchTouchEvent(e);
            }
            // Fire Stick: tratamento do controle remoto ANTES de qualquer View.
            // OK sem menu selecionado sempre pausa/continua. Seta para baixo revela
            // os controles; esquerda/direita navegam, OK executa o controle destacado.
            // ACTION_UP e repeticoes sao consumidos para impedir cliques residuais em Voltar.
            @Override public boolean dispatchKeyEvent(KeyEvent event) {
              if(trackDialogVisible)return super.dispatchKeyEvent(event);
              int code=event.getKeyCode();
              boolean ok=code==KeyEvent.KEYCODE_DPAD_CENTER || code==KeyEvent.KEYCODE_ENTER;
              boolean mediaOk=code==KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE;
              if((ok||mediaOk) && p!=null && vod && !panelVisible){
                if(event.getAction()==KeyEvent.ACTION_UP){remoteOkHandled=false;return true;}
                if(event.getAction()!=KeyEvent.ACTION_DOWN||event.getRepeatCount()!=0)return true;
                if(remoteOkHandled)return true;
                remoteOkHandled=true;
                if(ok && episodes && nextPrompt.getVisibility()==View.VISIBLE && selectedControl<0){nextEpisode();return true;}
                if(ok && selectedControl>=0){activateControl();return true;}
                if(ok && seekBarSelected){seekBarSelected=false;selectControl(indexOfControl(playControl));return true;}
                togglePlay();return true;
              }
              if(event.getAction()==KeyEvent.ACTION_DOWN && p!=null && vod && !panelVisible){
                if(code==KeyEvent.KEYCODE_DPAD_DOWN){
                  if(seekBarSelected){selectControl(indexOfControl(playControl));}
                  else if(selectedControl<0){selectControl(indexOfControl(playControl));}
                  else {show(nm());}
                  return true;
                }
                if(code==KeyEvent.KEYCODE_DPAD_UP){
                  if(seekBarSelected){seekBarSelected=false;selectedControl=-1;styleSelectedControl();show(nm());return true;}
                  if(selectedControl>=0 && timeline.isEnabled() && timelineBox.getVisibility()==View.VISIBLE){
                    selectedControl=-1;seekBarSelected=true;styleSelectedControl();show(nm());
                  } else if(selectedControl>=0){selectedControl=-1;seekBarSelected=false;styleSelectedControl();show(nm());}
                  else {show(nm());}
                  return true;
                }
                if(code==KeyEvent.KEYCODE_DPAD_LEFT || code==KeyEvent.KEYCODE_DPAD_RIGHT){
                  if(selectedControl>=0){moveControl(code==KeyEvent.KEYCODE_DPAD_RIGHT?1:-1);return true;}
                  // Com a barra escolhida, pular 10s e manter o marcador atualizado.
                  if(seekBarSelected){seekSeconds(code==KeyEvent.KEYCODE_DPAD_RIGHT?10:-10);return true;}
                }
              }
              if((code==KeyEvent.KEYCODE_DPAD_LEFT||code==KeyEvent.KEYCODE_DPAD_RIGHT||code==KeyEvent.KEYCODE_DPAD_UP||code==KeyEvent.KEYCODE_DPAD_DOWN)
                 && event.getAction()==KeyEvent.ACTION_UP && p!=null && vod && !panelVisible)return true;
              return super.dispatchKeyEvent(event);
            }
            @Override public boolean onKeyDown(int k, KeyEvent e) {
              boolean multi = list != null && list.length() > 1;
              if (panelVisible) {
                if (k == KeyEvent.KEYCODE_BACK || k == KeyEvent.KEYCODE_ESCAPE || k == KeyEvent.KEYCODE_DPAD_LEFT) { togglePanel(false); return true; }
                if (k == KeyEvent.KEYCODE_DPAD_UP) { selection = (selection - 1 + list.length()) % list.length(); drawChannels(); return true; }
                if (k == KeyEvent.KEYCODE_DPAD_DOWN) { selection = (selection + 1) % list.length(); drawChannels(); return true; }
                if (k == KeyEvent.KEYCODE_DPAD_CENTER || k == KeyEvent.KEYCODE_ENTER) {
                  int newIndex = selection; togglePanel(false); go(newIndex - i); return true;
                }
                return true;
              }
              if (!vod && k == KeyEvent.KEYCODE_DPAD_RIGHT) { togglePanel(true); return true; }
              if (k == KeyEvent.KEYCODE_DPAD_UP || k == KeyEvent.KEYCODE_CHANNEL_UP) { if (multi) go(-1); return true; }
              if (k == KeyEvent.KEYCODE_DPAD_DOWN || k == KeyEvent.KEYCODE_CHANNEL_DOWN) { if (multi) go(1); return true; }
              if (episodes && nextPrompt.getVisibility()==View.VISIBLE && (k==KeyEvent.KEYCODE_DPAD_RIGHT || k==KeyEvent.KEYCODE_DPAD_CENTER || k==KeyEvent.KEYCODE_ENTER)) {
                nextEpisode(); return true;
              }
              if (vod && (k == KeyEvent.KEYCODE_DPAD_LEFT || k == KeyEvent.KEYCODE_MEDIA_REWIND)) {
                p.seekTo(Math.max(0, p.getCurrentPosition() - 10000));
                show(nm() + "  " + tm(p.getCurrentPosition()) + " / " + tm(p.getDuration()));
                return true;
              }
              if (vod && (k == KeyEvent.KEYCODE_DPAD_RIGHT || k == KeyEvent.KEYCODE_MEDIA_FAST_FORWARD)) {
                p.seekTo(p.getCurrentPosition() + 10000);
                show(nm() + "  " + tm(p.getCurrentPosition()) + " / " + tm(p.getDuration()));
                return true;
              }
              if (k == KeyEvent.KEYCODE_DPAD_CENTER || k == KeyEvent.KEYCODE_ENTER || k == KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE) {
                if (vod) {
                  if (p.isPlaying()) p.pause(); else p.play();
                  show(nm() + "  " + tm(p.getCurrentPosition()) + " / " + tm(p.getDuration()) + (p.getPlayWhenReady() ? "" : "  (pausado)"));
                } else {
                  if (p.getPlaybackState() == Player.STATE_IDLE || p.getPlayerError() != null || p.getPlaybackState() == Player.STATE_ENDED) go(0);
                  else show(nm());
                }
                return true;
              }
              return super.onKeyDown(k, e);
            }
            @Override protected void onStop() {
              super.onStop();
              cancelNext(); h.removeCallbacks(hide);h.removeCallbacks(progressTick);
              savePosition(true);
              if (p != null) { p.release(); p = null; }
              finish();
            }
          }
          PLAYERACTIVITY
      - name: Restaurar chave privada de assinatura
        shell: bash
        run: |
          set -euo pipefail
          for item in NICO_KEYSTORE_BASE64 NICO_STORE_PASSWORD NICO_KEY_ALIAS NICO_KEY_PASSWORD; do
            if [[ -z "${!item:-}" ]]; then
              echo "::error::GitHub Secret ausente: ${item}. Configure os quatro secrets antes de compilar."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/nico-tv-release.jks"
          printf '%s' "$NICO_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          [[ -s "$KEYSTORE_PATH" ]] || { echo '::error::Keystore vazio.'; exit 1; }
          echo "NICO_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Compilar APK assinado de produção
        run: cd proj && gradle assembleRelease --no-daemon
      - name: Preparar arquivo
        run: |
          set -euo pipefail
          cp proj/app/build/outputs/apk/release/app-release.apk nicotv.apk
          test -s nicotv.apk
      - name: Publicar APK na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Nico TV ${{ github.run_number }}
          files: nicotv.apk
          fail_on_unmatched_files: true
          make_latest: true
          draft: false
          prerelease: false
      - name: Validar APK publicado
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "v${{ github.run_number }}" --json assets --jq '.assets[].name' | grep -Fx 'nicotv.apk'
          echo "APK confirmado na Release v${{ github.run_number }}"
