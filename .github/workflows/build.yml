            int indexOfControl(TextView control){return tvButtons.indexOf(control);}
            boolean isAvailableControl(int index){return index>=0&&index<tvButtons.size()&&tvButtons.get(index).getVisibility()==View.VISIBLE;}
            void styleSelectedControl(){
              for(int n=0;n<tvButtons.size();n++){
                TextView b=tvButtons.get(n);
                boolean chosen=n==selectedControl && b.getVisibility()==View.VISIBLE;
                GradientDrawable bg=new GradientDrawable();
                bg.setColor(chosen ? 0xFFF2C456 : 0xFF221C14);
                bg.setCornerRadius(dp(13));
                bg.setStroke(dp(chosen?2:1),chosen ? 0xFFFFE49A : 0x665D482A);
                b.setBackground(bg);
                b.setTextColor(chosen ? 0xFF160F06 : 0xFFF3E9D8);
                b.setElevation(chosen?dp(7):0);
              }
              if(timelineBox!=null){
                GradientDrawable bar=new GradientDrawable();
                bar.setColor(0xEB0E0C09);
