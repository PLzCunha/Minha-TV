              p.addListener(new Player.Listener() {
                @Override public void onPlayerError(PlaybackException e) {
                  int httpCode = 0;
                  Throwable cause = e;
                  for (int depth=0; cause!=null && depth<8; depth++,cause=cause.getCause()) {
                    if (cause instanceof HttpDataSource.InvalidResponseCodeException) {
                      httpCode = ((HttpDataSource.InvalidResponseCodeException)cause).responseCode;
                      break;
                    }
                  }
                  // Alguns provedores Xtream aceitam .ts em vez de .m3u8 para canais ao vivo.
                  // Nunca tentar em VOD, nem repetir mais de uma vez, nem para 401/403/5xx.
                  if (!vod && !liveTsFallbackTried && (httpCode==404 || httpCode==410)) {
                    try {
                      String currentUrl=list.getJSONArray(i).getString(1);
                      if (currentUrl.matches("(?i).*\\.m3u8(?:\\?.*)?$")) {
                        liveTsFallbackTried=true;
                        String alternate=currentUrl.replaceFirst("(?i)\\.m3u8(?=\\?|$)", ".ts");
                        status.setText("Tentando formato alternativo do canal…");
                        status.setVisibility(View.VISIBLE);
                        p.setMediaItem(MediaItem.fromUri(alternate));
                        p.prepare();p.play();
                        return;
                      }
                    } catch (Exception ignored) {}
                  }
                  String detail;
                  if(httpCode!=0) detail="HTTP "+httpCode+" — servidor de vídeo";
                  else if(e.errorCode==PlaybackException.ERROR_CODE_DECODING_FAILED || e.errorCode==PlaybackException.ERROR_CODE_DECODER_INIT_FAILED)
                    detail="Decodificação não suportada neste dispositivo";
                  else if(e.errorCode==PlaybackException.ERROR_CODE_IO_NETWORK_CONNECTION_FAILED || e.errorCode==PlaybackException.ERROR_CODE_IO_NETWORK_CONNECTION_TIMEOUT)
                    detail="Falha de conexão com o servidor de vídeo";
                  else detail="Erro do player: código "+e.errorCode;
                  // Diagnóstico 2.7.4 — não muda o pipeline de decodificação.
                  // Informa a mídia recebida e o dispositivo, sem expor URLs nem credenciais Xtream.
                  if(e.errorCode==PlaybackException.ERROR_CODE_DECODING_FAILED || e.errorCode==PlaybackException.ERROR_CODE_DECODER_INIT_FAILED){
                    Format vf=p.getVideoFormat();
                    String renderer="não identificado";
                    if(e instanceof androidx.media3.exoplayer.ExoPlaybackException){
                      androidx.media3.exoplayer.ExoPlaybackException ex=(androidx.media3.exoplayer.ExoPlaybackException)e;
                      if(ex.rendererFormat!=null)vf=ex.rendererFormat;
                      if(ex.rendererName!=null)renderer=ex.rendererName;
                    }
                    String codec=vf==null?"não identificado":(vf.codecs!=null?vf.codecs:(vf.sampleMimeType!=null?vf.sampleMimeType:"não identificado"));
                    String res=vf!=null && vf.width>0 && vf.height>0?vf.width+"x"+vf.height:"não identificada";
                    String decoder="não informado",diag="não informado",mime="não identificado";
                    Throwable nested=e;
                    for(int depth=0;nested!=null&&depth<10;depth++,nested=nested.getCause()){
                      if(nested instanceof androidx.media3.exoplayer.mediacodec.MediaCodecRenderer.DecoderInitializationException){
                        androidx.media3.exoplayer.mediacodec.MediaCodecRenderer.DecoderInitializationException dx=
                            (androidx.media3.exoplayer.mediacodec.MediaCodecRenderer.DecoderInitializationException)nested;
                        if(dx.mimeType!=null)mime=dx.mimeType;
                        if(dx.codecInfo!=null)decoder=dx.codecInfo.name;
                        if(dx.diagnosticInfo!=null)diag=dx.diagnosticInfo;
                        break;
                      }
                    }
                    detail += "\nCodec: "+codec+" | MIME: "+mime+" | "+res+
                      "\nDecoder: "+decoder+" | Diagnóstico: "+diag+
                      "\nModelo: "+android.os.Build.MODEL+" | Código: "+e.errorCode;
                    android.util.Log.e("NicoTV-Codec", "Renderer="+renderer+" codec="+codec+" mime="+mime+
                      " resolução="+res+" decoder="+decoder+" diagnóstico="+diag+
                      " dispositivo="+android.os.Build.MODEL+" código="+e.errorCode);
                  }
                  status.setText("Não foi possível reproduzir.\n"+detail+"\nOK: tentar novamente  •  ↑ ↓: trocar");
                  status.setVisibility(android.view.View.VISIBLE);
                  android.util.Log.e("NicoTV-Playback", "ExoPlayer "+detail, e);
                  show(nm());
                }
                @Override public void onPlaybackStateChanged(int state) {
                  if (state == Player.STATE_BUFFERING) {
                    status.setText("Carregando transmissão…");
                    status.setVisibility(android.view.View.VISIBLE);
                  } else if (state == Player.STATE_READY) {
                    status.setVisibility(android.view.View.GONE);
                    if(!resumedCurrentItem){resumedCurrentItem=true;restorePosition();}
                    refreshTimeline();
                  } else if (state == Player.STATE_ENDED && episodes) {
                    savePosition(true);clearPosition();offerNext();
                  } else if (state == Player.STATE_ENDED && vod) {
                    savePosition(true);
                  } else if (state == Player.STATE_ENDED && !vod) {
                    status.setText("Transmissão encerrada. Pressione OK para tentar novamente.");
                    status.setVisibility(android.view.View.VISIBLE);
                  }
                }
                @Override public void onIsPlayingChanged(boolean playing) {
                  if (playControl != null) playControl.setText(playing ? "Ⅱ" : "▶");
                }
              });
              go(0);
              h.post(progressTick);
            }
            String trackName(Format format,int number){
              String label=format.label;
              String lang=format.language;
              String suffix=(label!=null&&!label.trim().isEmpty())?label.trim():
                (lang!=null&&!lang.isEmpty()&&!"und".equals(lang)?new java.util.Locale(lang).getDisplayLanguage(new java.util.Locale("pt","BR")):"Faixa "+number);
              return number+"  •  "+suffix;
            }
            void showTrackDialog(int type){
              if(p==null)return;
              java.util.ArrayList<String> labels=new java.util.ArrayList<>();
              java.util.ArrayList<androidx.media3.common.TrackGroup> groups=new java.util.ArrayList<>();
              java.util.ArrayList<Integer> indexes=new java.util.ArrayList<>();
              labels.add(type==C.TRACK_TYPE_TEXT?"Desativar legendas":"Seleção automática");
              groups.add(null);indexes.add(-1);
              int current=0;
              TrackSelectionParameters parameters=p.getTrackSelectionParameters();
              for(Tracks.Group group:p.getCurrentTracks().getGroups()){
                if(group.getType()!=type)continue;
                for(int j=0;j<group.length;j++){
                  if(!group.isTrackSupported(j))continue;
                  labels.add(trackName(group.getTrackFormat(j),labels.size()));
                  groups.add(group.getMediaTrackGroup());indexes.add(j);
                  if(group.isTrackSelected(j))current=labels.size()-1;
                }
              }
              if(labels.size()==1){
                trackDialogVisible=true;
                android.app.AlertDialog info=new AlertDialog.Builder(this).setTitle(type==C.TRACK_TYPE_TEXT?"Legendas":"Áudio")
                  .setMessage("Nenhuma faixa alternativa disponível neste conteúdo.")
                  .setPositiveButton("OK",(dialog,which)->{}).create();
                info.setOnDismissListener(dialog->trackDialogVisible=false);info.show();
                return;
              }
              final int selected=current;
              trackDialogVisible=true;
              AlertDialog choiceDialog=new AlertDialog.Builder(this)
                .setTitle(type==C.TRACK_TYPE_TEXT?"Nico TV  •  Legendas":"Nico TV  •  Áudio")
                .setSingleChoiceItems(labels.toArray(new String[0]),selected,(dialog,choice)->{
                  TrackSelectionParameters.Builder builder=p.getTrackSelectionParameters().buildUpon().clearOverridesOfType(type);
                  if(choice==0){
                    builder.setTrackTypeDisabled(type,type==C.TRACK_TYPE_TEXT);
                  } else {
                    builder.setTrackTypeDisabled(type,false);
                    builder.addOverride(new TrackSelectionOverride(groups.get(choice),indexes.get(choice)));
                  }
                  p.setTrackSelectionParameters(builder.build());
                  dialog.dismiss();show(nm());
                })
                .setNegativeButton("Voltar",(dialog,which)->{})
                .create();
              choiceDialog.setOnDismissListener(dialog->trackDialogVisible=false);
              choiceDialog.show();
            }
