<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nico TV • Fire Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e14;
  --bg2:#101723;
  --panel:#121926;
  --panel2:#182132;
  --line:#29364d;
  --text:#f4f7fb;
  --muted:#93a2b8;
  --gold:#e4c16d;
  --gold2:#c79d48;
  --cyan:#74d9ff;
  --cyan2:#2cb7e6;
  --good:#46d2a0;
  --danger:#ff7575;
  --focus:#f6d17b;
  --shadow:0 18px 50px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
 radial-gradient(1200px 500px at 90% -10%, rgba(228,193,109,.16), transparent 55%),
 radial-gradient(800px 400px at 10% 0%, rgba(116,217,255,.10), transparent 55%),
 linear-gradient(180deg,#090d13,#0b1018 20%,#090d14);
 color:var(--text);font:400 16px/1.45 Manrope,system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{text-decoration:none;color:inherit}
:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;box-shadow:0 0 0 8px rgba(228,193,109,.12)}
.shell{display:grid;grid-template-columns:108px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid #1f2b3f;background:linear-gradient(180deg,#0b1017,#0d1320 70%,#0a0f17);display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;justify-content:center;height:78px;border-radius:20px;background:linear-gradient(145deg,#172236,#0f1623);border:1px solid #253248;color:var(--text);font-weight:800;letter-spacing:.02em;font-size:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.logo img{display:block;width:100%;max-width:67px;aspect-ratio:1;object-fit:contain;border-radius:16px}
.logo small{display:block;font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.22em;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:10px}
.navbtn{height:54px;border-radius:18px;background:linear-gradient(145deg,#121a29,#0e1520);border:1px solid #223046;color:#d7deea;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .16s,border-color .16s,background .16s}
.navbtn .ico{font-size:20px}
.navbtn.active,.navbtn[aria-pressed=true]{background:linear-gradient(145deg,#2a2518,#181611);border-color:#6d5931;color:#fff;box-shadow:0 10px 30px rgba(228,193,109,.10)}
.navbtn:hover{transform:translateY(-1px);border-color:#3d4f6b}
.navlabel{position:absolute;left:66px;background:#09101bcc;border:1px solid #2a3a54;color:#eef4f8;padding:8px 12px;border-radius:12px;white-space:nowrap;opacity:0;pointer-events:none;transform:translateX(-8px);transition:.16s;font-size:14px;font-weight:700;backdrop-filter:blur(8px)}
.navbtn:hover .navlabel,.navbtn:focus-visible .navlabel{opacity:1;transform:translateX(0)}
.sidebar .spacer{flex:1}
.main{padding:22px 28px 28px;min-width:0}
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.appname{font-size:34px;font-weight:800;letter-spacing:-.04em}
.appname .muted{color:var(--gold)}
.wordmark{display:block;width:clamp(210px,25vw,345px);height:auto;max-height:86px;object-fit:contain;object-position:left center}
.subtitle{color:var(--muted);font-size:14px;margin-top:3px}
.searchwrap{margin-left:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:10px;min-width:280px;max-width:540px;flex:1;background:linear-gradient(145deg,#101826,#121d2d);border:1px solid #27364d;border-radius:18px;padding:0 14px;height:54px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.search input{width:100%;background:none;border:0;color:var(--text)}
.metric-pill{padding:10px 14px;border-radius:14px;background:#0f1622;border:1px solid #223046;color:#cdd7e5;font-size:13px;font-weight:700}
.page-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:50px;padding:0 16px;border-radius:16px;border:1px solid #2a3950;background:linear-gradient(145deg,#121a29,#0d1420);color:#f1f5fb;font-weight:700;transition:.16s}
.btn:hover{transform:translateY(-1px);border-color:#3a4e68}
.btn.main{background:linear-gradient(145deg,var(--gold),#cfab5d);border-color:#cfab5d;color:#1c1407}
.btn.ghost{background:#0f1622}
.btn.soft{background:linear-gradient(145deg,#132234,#102031);border-color:#294257;color:#d6eff8}
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.9fr);gap:20px;padding:28px;border-radius:28px;background:linear-gradient(135deg,#131c2b,#121621 55%,#0e131d);border:1px solid #26334a;box-shadow:var(--shadow)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:999px;pointer-events:none}
.hero:before{width:360px;height:360px;right:-80px;top:-110px;background:radial-gradient(circle,rgba(228,193,109,.22),transparent 65%)}
.hero:after{width:320px;height:320px;left:-120px;bottom:-160px;background:radial-gradient(circle,rgba(116,217,255,.12),transparent 68%)}
.hero-copy,.hero-media{position:relative;z-index:1}
.kicker{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border-radius:999px;background:#101927;border:1px solid #26354d;color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.hero h1{margin:16px 0 10px;font-size:clamp(34px,5vw,56px);line-height:.98;letter-spacing:-.05em}
.hero h1 .accent{color:var(--gold)}
.hero p{margin:0 0 18px;color:#c7d3e1;max-width:760px}
.hero-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chip{padding:8px 12px;border-radius:999px;background:#111b2a;border:1px solid #294057;color:#dbe7f0;font-size:13px;font-weight:700}
.chip.accent{background:#1f1a10;border-color:#5f4c2b;color:#ffe0a0}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.hero-media{display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.media-card{min-height:210px;border-radius:24px;padding:18px;background:linear-gradient(145deg,#101825,#162236);border:1px solid #294257;display:flex;gap:18px;align-items:flex-end;justify-content:space-between;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.media-thumb{width:min(34%,150px);aspect-ratio:2/3;border-radius:18px;background:linear-gradient(180deg,#4f2f68,#1e325f);border:1px solid #38506f;overflow:hidden;display:grid;place-items:center}
.media-thumb img{width:100%;height:100%;object-fit:cover}
.media-info{flex:1;min-width:0}
.media-title{font-size:28px;font-weight:800;letter-spacing:-.04em}
.media-sub{color:var(--muted);font-size:14px;margin-top:6px}
.media-lines{display:grid;gap:10px;margin-top:16px}
.media-line{height:8px;border-radius:999px;background:linear-gradient(90deg,rgba(228,193,109,.8),rgba(228,193,109,.22));width:100%}
.media-line.small{width:62%}
.media-line.tiny{width:35%}
.control-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0 8px}
.control-card{border-radius:22px;background:linear-gradient(145deg,#121a29,#0f1521);border:1px solid #24334b;padding:18px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.control-card .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;font-weight:800}
.control-card .value{font-size:30px;font-weight:800;letter-spacing:-.04em}
.section{margin-top:18px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
.section-title{font-size:28px;font-weight:800;letter-spacing:-.04em}
.section-sub{color:var(--muted);font-size:14px}
.row{margin-top:18px}
.row-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.row-title-btn,.row-title{font:800 22px/1 Manrope,sans-serif;color:var(--text);letter-spacing:-.03em}
.row-title-btn{background:none;border:0;padding:0}
.row-title-btn:hover{color:#fff}
.row-subcount{font-size:13px;color:var(--muted)}
.strip{display:flex;gap:14px;overflow:auto;padding:2px 2px 8px;scrollbar-width:none;scroll-padding:20px}.strip::-webkit-scrollbar{display:none}
.card{position:relative;flex:none;width:220px;border-radius:22px;padding:14px;background:linear-gradient(145deg,#151e2d,#101723);border:1px solid #26354d;box-shadow:var(--shadow);transition:transform .16s,border-color .16s,box-shadow .16s}
.card:hover,.card:focus{transform:translateY(-2px) scale(1.02);border-color:#c9a85f;box-shadow:0 20px 45px rgba(0,0,0,.5),0 0 0 1px rgba(228,193,109,.2)}
.card.poster{width:180px}.card.poster .thumb{aspect-ratio:2/3}
.thumb{width:100%;aspect-ratio:16/9;border-radius:16px;background:linear-gradient(145deg,#1a2740,#101621);border:1px solid #2c3e59;overflow:hidden;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .placeholder{font-size:34px;color:#d4b369}
.card-body{padding-top:12px}
.card-title{font-size:18px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:13px;color:var(--muted);margin-top:4px;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-epg{margin-top:10px;padding:8px 10px;border-radius:12px;background:#111924;border:1px solid #23344b;font-size:12px;color:#dce7f1;min-height:46px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.card-epg .next{color:#95b6c6}
.card-actions{display:flex;gap:8px;margin-top:12px}
.mini{padding:8px 12px;border-radius:12px;background:#101826;border:1px solid #26364f;font-size:12px;font-weight:800;color:#d9e5f0}
.mini.play{background:linear-gradient(145deg,var(--gold),#cfab5d);border-color:#cfa85d;color:#1e1609}
.favstar{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#09111bdd;border:1px solid #33435e;color:var(--gold);font-size:18px;z-index:2}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.empty{padding:18vh 6vw;text-align:center;color:var(--muted)}.empty h2{font-size:34px;color:#fff;letter-spacing:-.04em;margin:0 0 10px}
.detail{display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px}
.detail-side,.detail-main{border-radius:26px;background:linear-gradient(145deg,#121a29,#101723);border:1px solid #24354c;box-shadow:var(--shadow)}
.detail-side{padding:20px;display:flex;flex-direction:column;gap:18px}
.poster-lg{width:100%;aspect-ratio:2/3;border-radius:22px;background:linear-gradient(180deg,#503069,#204575);border:1px solid #395372;overflow:hidden}.poster-lg img{width:100%;height:100%;object-fit:cover}
.detail-title{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1}
.detail-sub{color:var(--muted)}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.detail-main{padding:22px}
.season-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.season-btn{padding:10px 14px;border-radius:14px;background:#101826;border:1px solid #2a3b54;color:#d8e3ee;font-weight:800}
.season-btn.active{background:linear-gradient(145deg,var(--gold),#cfab5d);border-color:#cfab5d;color:#1c1407}
.ep-list{display:grid;gap:10px}
.ep-item{padding:14px 16px;border-radius:16px;background:#0f1622;border:1px solid #23344d;display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:14px;align-items:center;transition:.16s}
.ep-item:hover,.ep-item:focus{border-color:#cfa85d;transform:translateY(-1px)}
.ep-thumb{height:54px;border-radius:12px;background:linear-gradient(145deg,#235a7a,#46325c);border:1px solid #466174}
.ep-name{font-weight:800;letter-spacing:-.02em}
.ep-meta{font-size:13px;color:var(--muted)}
#player{position:fixed;inset:0;z-index:40;background:#000;display:none}
#player.on{display:block}
#player video{width:100%;height:100%;background:#000}
#playerBar{position:absolute;left:0;right:0;top:0;padding:18px 24px;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);display:flex;align-items:flex-start;justify-content:space-between;gap:18px;transition:opacity .25s}
#playerBar.hide{opacity:0}
.player-meta{display:grid;gap:6px;max-width:min(70vw,860px)}
#playerTitle{font-size:28px;font-weight:800;letter-spacing:-.04em}
#playerSub{font-size:14px;color:#d8e5ef}
.player-actions{display:flex;gap:10px;flex-wrap:wrap}
#playerMsg{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#fff;text-align:center;padding:20px;font-size:24px;text-shadow:0 2px 10px rgba(0,0,0,.8);white-space:pre-line}
#webcontrols{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#webcontrols .btn{background:#122036cc;backdrop-filter:blur(8px)}
#drawer{position:absolute;right:24px;top:92px;bottom:96px;width:min(360px,42vw);background:rgba(10,14,20,.88);backdrop-filter:blur(12px);border:1px solid #273754;border-radius:24px;padding:16px;display:none;box-shadow:var(--shadow)}
#drawer.on{display:flex;flex-direction:column}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.drawer-title{font-size:18px;font-weight:800}
.drawer-list{overflow:auto;display:grid;gap:8px;padding-right:4px}
.drawer-item{padding:12px 14px;border-radius:14px;background:#111a27;border:1px solid #22334c;display:grid;gap:4px}
.drawer-item.active{background:linear-gradient(145deg,#2a2416,#15120c);border-color:#caa75f}
.drawer-item .small{font-size:12px;color:#97aabd}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:12px 18px;border-radius:14px;background:#152333;border:1px solid #29455b;color:#e8f6fb;z-index:120;opacity:0;pointer-events:none;transition:opacity .16s}
#toast.show{opacity:1}
.hidden{display:none!important}
dialog{background:linear-gradient(145deg,#111926,#0d131f);color:var(--text);border:1px solid #26364d;border-radius:24px;width:min(620px,94vw);padding:22px;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 12px;font-size:28px;letter-spacing:-.04em}
.tabs{display:flex;gap:10px;margin-bottom:14px}
.tabs .btn[aria-pressed=true]{background:linear-gradient(145deg,var(--gold),#cfab5d);border-color:#cfab5d;color:#1a1206}
label{display:block;margin:12px 0 6px;font-size:13px;color:#dce7f1;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
input[type=text],input[type=url],input[type=password],textarea{width:100%;border-radius:16px;border:1px solid #26364e;background:#0d1420;padding:14px 16px;color:var(--text)}
textarea{min-height:96px;resize:vertical}
.pane{display:none}.pane.on{display:block}.row2{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.hint{font-size:13px;color:var(--muted);margin-top:10px}#err{color:#ffd0d0;min-height:1.2em;margin-top:12px}
@media (max-width:1100px){
  .shell{grid-template-columns:88px minmax(0,1fr)}
  .hero{grid-template-columns:1fr}
  .control-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .detail{grid-template-columns:1fr}
}
@media (max-width:780px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:sticky;height:auto;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));padding:12px;border-right:0;border-bottom:1px solid #1f2b3f;gap:10px}
  .logo{grid-column:1/-1;height:78px;padding:8px}
  .nav{display:contents}.sidebar .spacer{display:none}.navlabel{display:none}
  .main{padding:16px}.topbar{align-items:flex-start}.searchwrap{margin-left:0;width:100%}.search{max-width:none;min-width:0}.appname{font-size:28px}.control-grid{grid-template-columns:1fr}.card{width:200px}.card.poster{width:160px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const state={
  channels:[], movies:null, series:null, xt:null,
  mode:'live', view:null, detail:null, detailSeason:0,
  favorites:loadArray('nico_favorites'), recent:loadArray('nico_recent'),
  favoriteOnly:false, recentOnly:false, query:'',
  loading:false, queue:[], qi:0, hls:null, drawer:false,
  epg:new Map(), epgSource:null, tab:'m3u'
};
function loadArray(k){ try{ const a=JSON.parse(store.get(k)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function saveState(){ store.set('nico_favorites',JSON.stringify(state.favorites)); store.set('nico_recent',JSON.stringify(state.recent)); }
function keyOf(c){ return c.url || (c.kind==='series' ? 'series:'+c.id : c.kind==='movie' ? 'movie:'+c.url : c.name); }
function isFav(c){ return state.favorites.includes(keyOf(c)); }
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2400); }
function markRecent(c){ const k=keyOf(c); state.recent=[k,...state.recent.filter(x=>x!==k)].slice(0,40); saveState(); }
function toggleFav(c){ const k=keyOf(c); const had=isFav(c); state.favorites = had ? state.favorites.filter(x=>x!==k) : [...state.favorites,k]; saveState(); toast(had?'Removido dos favoritos':'Adicionado aos favoritos'); render(); updatePlayerFav(); }
function updatePlayerFav(){ const c=state.queue[state.qi]; $('#playerFavBtn').textContent=c&&isFav(c)?'★ Favorito':'☆ Favorito'; }
function selectList(list){ if(state.favoriteOnly) return list.filter(isFav); if(state.recentOnly) return state.recent.map(k=>list.find(x=>keyOf(x)===k)).filter(Boolean); return list; }
function currentList(){ return state.mode==='movies' ? (state.movies||[]) : state.mode==='series' ? (state.series||[]) : state.channels; }

/* Android bridge */
const NATIVE = !!window.Android;
function nativeGet(u){ return new Promise((ok,no)=>{ const id='cb'+Date.now()+Math.floor(Math.random()*1e4); window[id]=(good,d)=>{ delete window[id]; good ? ok(d) : no(new Error('http')); }; Android.get(u,id); }); }
async function getText(u){ if(NATIVE) return nativeGet(u); const r=await fetch(u); if(!r.ok) throw new Error('http'); return r.text(); }
async function getJSON(u){ return JSON.parse(await getText(u)); }

/* Parsing */
function parseM3U(text){
  let info=null; const out=[]; let epgUrl='';
  const lines=text.split(/\r?\n/);
  if(lines[0] && lines[0].startsWith('#EXTM3U')){
    const m=lines[0].match(/x-tvg-url="([^"]+)"/i) || lines[0].match(/url-tvg="([^"]+)"/i);
    if(m) epgUrl=m[1].trim();
  }
  for(const raw of lines){
    const line=raw.trim();
    if(line.startsWith('#EXTINF')){
      const attr = k => { const m=line.match(new RegExp(k+'="([^"]*)"','i')); return m?m[1]:''; };
      info={
        name: line.slice(line.lastIndexOf(',')+1).trim() || attr('tvg-name') || 'Sem nome',
        logo: attr('tvg-logo'),
        group: attr('group-title') || 'Outros',
        tvgId: attr('tvg-id') || attr('tvg-name') || ''
      };
    } else if(line && !line.startsWith('#') && info){ out.push({...info, url:line}); info=null; }
  }
  return { list:out, epgUrl };
}
function parseXmltvDate(v){
  if(!v) return null;
  const m=String(v).match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\s*([+\-]\d{4})?/);
  if(!m) return null;
  const [,Y,M,D,h,mn,s,off]=m;
  const iso=`${Y}-${M}-${D}T${h}:${mn}:${s}${off?off.slice(0,3)+':'+off.slice(3):''}`;
  const d=new Date(iso);
  return isNaN(d) ? null : d;
}
function timeFmt(d){ return d ? d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : ''; }
function parseEpg(xml){
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  const items=[...doc.querySelectorAll('programme')];
  const now=new Date();
  const buckets=new Map();
  for(const p of items){
    const start=parseXmltvDate(p.getAttribute('start')); const stop=parseXmltvDate(p.getAttribute('stop'));
    if(!start||!stop) continue;
    if(stop < new Date(now.getTime()-2*60*60*1000) || start > new Date(now.getTime()+18*60*60*1000)) continue;
    const ch=(p.getAttribute('channel')||'').trim(); if(!ch) continue;
    const title=(p.querySelector('title')?.textContent||'Sem título').trim();
    const entry={start,stop,title};
    if(!buckets.has(ch)) buckets.set(ch,[]);
    buckets.get(ch).push(entry);
  }
  const map=new Map();
  for(const [ch,list] of buckets){
    list.sort((a,b)=>a.start-b.start);
    const current=list.find(x=>x.start<=now && x.stop>now) || null;
    const next=list.find(x=>x.start>now) || null;
    map.set(ch,{current,next});
  }
  state.epg=map;
}
async function loadEpg(url){
  if(!url) return;
  try{ const xml=await getText(url); parseEpg(xml); state.epgSource=url; }
  catch(e){ toast('EPG não pôde ser carregado'); }
}
function epgFor(c){
  const id=(c.tvgId||c.name||'').trim();
  return state.epg.get(id) || state.epg.get(c.name) || null;
}
function currentProgramText(c){
  const epg=epgFor(c); if(!epg) return '';
  const cur=epg.current; const nxt=epg.next;
  if(cur&&nxt) return `${timeFmt(cur.start)} · ${cur.title} • Próximo ${timeFmt(nxt.start)} ${nxt.title}`;
  if(cur) return `${timeFmt(cur.start)} · ${cur.title}`;
  if(nxt) return `Próximo ${timeFmt(nxt.start)} · ${nxt.title}`;
  return '';
}

async function loadXtream(server,user,pass){
  let base=server.trim().replace(/\/+$/,''); if(!/^https?:\/\//i.test(base)) base='http://'+base;
  const api=`${base}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`;
  state.xt={base,user,pass,api};
  const [cats,streams]=await Promise.all([getJSON(api+'&action=get_live_categories'),getJSON(api+'&action=get_live_streams')]);
  const names={}; (cats||[]).forEach(c=>names[c.category_id]=c.category_name);
  if(!Array.isArray(streams)) throw new Error('auth');
  return streams.map(s=>({ name:s.name||'Sem nome', logo:s.stream_icon||'', group:names[s.category_id]||'Outros', tvgId:String(s.epg_channel_id||s.name||''), url:`${base}/live/${encodeURIComponent(user)}/${encodeURIComponent(pass)}/${s.stream_id}.m3u8` }));
}
async function importFrom(src){
  state.loading=true; render();
  state.xt=null; state.epg=new Map(); state.epgSource=null;
  try{
    let list=[]; let epgUrl='';
    if(src.type==='xt'){
      list=await loadXtream(src.server,src.user,src.pass);
    } else {
      let text=src.text;
      if(!text) text=await getText(src.url);
      const parsed=parseM3U(text);
      list=parsed.list; epgUrl=src.epgUrl || parsed.epgUrl || '';
      if(src.text && src.text.length<3e6) src.keep=true;
    }
    if(!list.length) throw new Error('empty');
    state.channels=list; state.movies=null; state.series=null; state.mode='live'; state.view=null; state.detail=null; state.query=''; state.favoriteOnly=false; state.recentOnly=false; $('#search').value='';
    store.set('nico_source',JSON.stringify(src.type==='xt'||src.url||src.epgUrl?src:{type:'m3u',text:src.text}));
    if(epgUrl) await loadEpg(epgUrl);
    render();
  } finally { state.loading=false; render(); }
}

function appendRow(app,title,list,opts={}){

/* Player */
function play(list,i,vod){
  if(NATIVE){ if(list[i]) markRecent(list[i]); const a=Math.max(0,i-250); const j=JSON.stringify(list.slice(a,i+250).map(c=>[c.name,c.url])); if(vod&&Android.playVod) Android.playVod(j,i-a); else Android.play(j,i-a); return; }
  state.queue=list; state.qi=i; state.drawer=false; startPlayback(vod);
}
function playerSubtitle(c,vod){ const epg=currentProgramText(c); if(vod) return 'Conteúdo sob demanda · Enter pausa ou continua · ← → avança 10s'; return epg || 'Ao vivo · ↑ ↓ troca de canal · → abre lista rápida'; }
function startPlayback(vod){
  const c=state.queue[state.qi]; if(!c) return; markRecent(c); updatePlayerFav(); $('#player').classList.add('on'); $('#drawer').classList.remove('on');
  $('#playerTitle').textContent=c.name; $('#playerSub').textContent=playerSubtitle(c,vod);
  const v=$('#video'); const msg=$('#playerMsg'); msg.style.display='grid'; msg.textContent='Carregando…';
  if(state.hls){ state.hls.destroy(); state.hls=null; }
  const fail=()=>{ msg.style.display='grid'; msg.textContent='Não foi possível reproduzir.\nUse Tentar novamente ou troque de canal.'; };
  v.onplaying=()=>{ msg.style.display='none'; }; v.onerror=fail;
  if(window.Hls && Hls.isSupported() && /\.m3u8(\?|$)/i.test(c.url)){
    state.hls=new Hls(); state.hls.loadSource(c.url); state.hls.attachMedia(v); state.hls.on(Hls.Events.ERROR,(e,d)=>{ if(d.fatal) fail(); });
  } else v.src=c.url;
  v.play().catch(()=>{}); showPlayerBar(); renderDrawer();
}
function showPlayerBar(){ $('#playerBar').classList.remove('hide'); clearTimeout(showPlayerBar.t); showPlayerBar.t=setTimeout(()=>$('#playerBar').classList.add('hide'),3600); }
function stopPlayback(){ const v=$('#video'); if(state.hls){ state.hls.destroy(); state.hls=null; } v.pause(); v.removeAttribute('src'); v.load(); $('#player').classList.remove('on'); $('#drawer').classList.remove('on'); focusFirst(); }
function renderDrawer(){ const list=$('#drawerList'); list.innerHTML=''; state.queue.forEach((c,idx)=>{ const item=document.createElement('button'); item.className='drawer-item'+(idx===state.qi?' active':''); item.innerHTML=`<div>${escapeHtml(c.name)}</div><div class="small">${escapeHtml(c.group||'Canal')}</div>`; item.onclick=()=>{ state.qi=idx; startPlayback(false); }; list.append(item); }); }
function toggleDrawer(force){ state.drawer = typeof force==='boolean' ? force : !state.drawer; $('#drawer').classList.toggle('on',state.drawer); if(state.drawer){ renderDrawer(); const cur=$$('#drawerList .drawer-item')[state.qi]; if(cur) cur.scrollIntoView({block:'nearest'}); } showPlayerBar(); }

/* Keyboard / remote */
document.addEventListener('keydown',e=>{
  const k=e.key; const playing=$('#player').classList.contains('on');
  if(['Escape','GoBack','BrowserBack','Backspace'].includes(k)||e.keyCode===4){
    if(NATIVE) return;
    if($('#dlg').open){ e.preventDefault(); $('#dlg').close(); return; }
    if(playing){ e.preventDefault(); if(state.drawer) toggleDrawer(false); else stopPlayback(); return; }
    if(state.detail){ e.preventDefault(); state.detail=null; render(); return; }
    if(state.view){ e.preventDefault(); state.view=null; render(); return; }
  }
  if(playing){
    showPlayerBar();
    if(k==='ArrowUp'){ e.preventDefault(); if(state.drawer){ state.qi=(state.qi-1+state.queue.length)%state.queue.length; renderDrawer(); } else { state.qi=(state.qi-1+state.queue.length)%state.queue.length; startPlayback(false); } }
    else if(k==='ArrowDown'){ e.preventDefault(); if(state.drawer){ state.qi=(state.qi+1)%state.queue.length; renderDrawer(); } else { state.qi=(state.qi+1)%state.queue.length; startPlayback(false); } }
    else if(k==='ArrowRight' && !state.drawer){ e.preventDefault(); toggleDrawer(true); }
    else if(k==='ArrowLeft' && state.drawer){ e.preventDefault(); toggleDrawer(false); }
    else if((k==='Enter'||k===' ') && state.drawer){ e.preventDefault(); const items=$$('#drawerList .drawer-item'); if(items[state.qi]) items[state.qi].click(); }
    return;
  }
  if($('#dlg').open) return;
  const el=document.activeElement;
  if(el && /INPUT|TEXTAREA/.test(el.tagName) && !k.startsWith('Arrow')) return;
  if(!k.startsWith('Arrow')) return;
  const nodes=[...document.querySelectorAll('.sidebar .navbtn,.topbar .btn,#search,#app .btn,#app .card,.favstar,.season-btn,.ep-item')].filter(o=>o.offsetParent!==null);
  if(!nodes.length) return;
  if(!nodes.includes(el)){ nodes[0].focus(); e.preventDefault(); return; }
  const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2; let best=null, bestScore=1e9;
  for(const o of nodes){ if(o===el) continue; const q=o.getBoundingClientRect(), ox=q.left+q.width/2, oy=q.top+q.height/2, dx=ox-cx, dy=oy-cy; let ok=false, score=1e9; if(k==='ArrowRight'){ ok=dx>4; score=dx+Math.abs(dy)*2.2; } else if(k==='ArrowLeft'){ ok=dx<-4; score=-dx+Math.abs(dy)*2.2; } else if(k==='ArrowDown'){ ok=dy>8; score=dy+Math.abs(dx)*1.5; } else if(k==='ArrowUp'){ ok=dy<-8; score=-dy+Math.abs(dx)*1.5; } if(ok && score<bestScore){ best=o; bestScore=score; } }
  if(best){ e.preventDefault(); best.focus({preventScroll:true}); best.scrollIntoView({block:'center',inline:'center',behavior:'smooth'}); }
});

function focusFirst(){ if(document.activeElement===$('#search')) return; const el=document.querySelector('#app .btn,#app .card,.sidebar .navbtn'); if(el) el.focus({preventScroll:true}); }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }
function escapeAttr(s){ return String(s??'').replace(/[^\w\-]+/g,'_'); }

(async()=>{
  try{ const saved=JSON.parse(store.get('nico_source')||'null'); if(saved) await importFrom(saved); else render(); }catch(e){ render(); }
})();
</script>
