name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NICO_KEYSTORE_BASE64: ${{ secrets.NICO_KEYSTORE_BASE64 }}
      NICO_STORE_PASSWORD: ${{ secrets.NICO_STORE_PASSWORD }}
      NICO_KEY_ALIAS: ${{ secrets.NICO_KEY_ALIAS }}
      NICO_KEY_PASSWORD: ${{ secrets.NICO_KEY_PASSWORD }}
      NICO_VERSION_RUN: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Montar projeto Android
        run: |
          set -e
          HTML=$(grep -l "window.Android" *.html | head -1)
          test -n "$HTML" || { echo "Envie o HTML novo (iptv-netflix.html) para o repositório"; exit 1; }
          mkdir -p proj/app/src/main/assets proj/app/src/main/java/com/nicotv/app proj/app/src/main/res/drawable-nodpi
          cp "$HTML" proj/app/src/main/assets/index.html
          cp nico-icon.png proj/app/src/main/res/drawable-nodpi/nico_icon.png
          cp nico-banner.png proj/app/src/main/res/drawable-nodpi/nico_banner.png
          cd proj
          cat > settings.gradle <<'SETTINGS'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          include ':app'
          SETTINGS
          cat > build.gradle <<'ROOTBUILD'
          plugins { id 'com.android.application' version '8.3.2' apply false }
          ROOTBUILD
          cat > gradle.properties <<'PROPS'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          PROPS
          cat > app/build.gradle <<'APPBUILD'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.nicotv.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.nicotv.app'
              minSdk 21
              targetSdk 33
              // O numero aumenta em cada execucao do workflow.
              versionCode 10000 + Integer.parseInt(System.getenv('NICO_VERSION_RUN') ?: '1')
              versionName "2.0.0.${System.getenv('NICO_VERSION_RUN') ?: '1'}"
            }
            signingConfigs {
              nicoRelease {
                storeFile file(System.getenv('NICO_KEYSTORE_PATH'))
                storePassword System.getenv('NICO_STORE_PASSWORD')
                keyAlias System.getenv('NICO_KEY_ALIAS')
                keyPassword System.getenv('NICO_KEY_PASSWORD')
              }
            }
            buildTypes {
              release {
                minifyEnabled false
                signingConfig signingConfigs.nicoRelease
              }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_1_8
              targetCompatibility JavaVersion.VERSION_1_8
            }
          }
          dependencies {
            implementation 'androidx.media3:media3-exoplayer:1.3.1'
            implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
            implementation 'androidx.media3:media3-ui:1.3.1'
            implementation 'androidx.core:core:1.12.0'
          }
          APPBUILD
          cat > app/src/main/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
            <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
            <uses-feature android:name="android.software.leanback" android:required="false"/>
            <application android:label="Nico TV" android:icon="@drawable/nico_icon" android:banner="@drawable/nico_banner" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
              <activity android:name=".MainActivity" android:banner="@drawable/nico_banner" android:exported="true" android:windowSoftInputMode="adjustResize" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                </intent-filter>
              </activity>
              <activity android:name=".PlayerActivity" android:exported="false" android:configChanges="orientation|screenSize|keyboardHidden"/>
              <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true">
                <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/nico_file_paths"/>
              </provider>
            </application>
          </manifest>
          MANIFEST
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/nico_file_paths.xml <<'FILEPATHS'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
            <external-files-path name="nico_updates" path="updates/"/>
          </paths>
          FILEPATHS
          cat > app/src/main/java/com/nicotv/app/MainActivity.java <<'MAINACTIVITY'
          package com.nicotv.app;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.app.AlertDialog;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import android.content.ActivityNotFoundException;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import org.json.JSONArray;
          import android.view.inputmethod.InputMethodManager;
          import android.content.Context;
          import android.view.View;
          import android.view.WindowManager;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.IOException;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          public class MainActivity extends Activity {
            WebView w;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              w.setFocusable(true);
              w.setFocusableInTouchMode(true);
              setContentView(w);
              getWindow().setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              w.setBackgroundColor(0xFF0A0E14);
              w.setWebViewClient(new WebViewClient());
              w.addJavascriptInterface(new Bridge(), "Android");
              w.loadUrl("file:///android_asset/index.html");
            }
            class Bridge {
              @JavascriptInterface public String getInstalledVersion() {
                try {
                  return getPackageManager().getPackageInfo(getPackageName(),0).versionName;
                } catch (Exception ignored) { return "Indisponível"; }
              }
              @JavascriptInterface public void showKeyboard() {
                runOnUiThread(() -> {
                  w.requestFocus();
                  w.postDelayed(() -> {
                    InputMethodManager imm=(InputMethodManager)getSystemService(Context.INPUT_METHOD_SERVICE);
                    if(imm!=null)imm.showSoftInput(w, InputMethodManager.SHOW_IMPLICIT);
                  }, 80);
                });
              }
              @JavascriptInterface public void hideKeyboard() {
                runOnUiThread(() -> {
                  InputMethodManager imm=(InputMethodManager)getSystemService(Context.INPUT_METHOD_SERVICE);
                  if(imm!=null)imm.hideSoftInputFromWindow(w.getWindowToken(),0);
                });
              }

              @JavascriptInterface public void openExternal(String url) {
                try {
                  Uri u = Uri.parse(url);
                  String host = u.getHost();
                  if (!"https".equalsIgnoreCase(u.getScheme()) || host == null ||
                      !(host.equalsIgnoreCase("youtube.com") || host.equalsIgnoreCase("www.youtube.com"))) return;
                  runOnUiThread(() -> {
                    try { startActivity(new Intent(Intent.ACTION_VIEW, u)); }
                    catch (Exception ignored) { nicoMessage("Trailer", "Não há aplicativo disponível para abrir o YouTube."); }
                  });
                } catch(Exception ignored) {}
              }
              @JavascriptInterface public void checkUpdates() {
                runOnUiThread(() -> checkForNicoUpdates());
              }

              @JavascriptInterface public void get(final String u, final String cb) {
                new Thread(() -> {
                  String res; boolean ok = true;
                  try { res = fetch(u, 0); } catch (Exception e) { ok = false; res = String.valueOf(e.getMessage()); }
                  final String js = "window['" + cb + "']&&window['" + cb + "'](" + ok + "," + JSONObject.quote(res) + ")";
                  runOnUiThread(() -> w.evaluateJavascript(js, null));
                }).start();
              }
              @JavascriptInterface public String getWatchHistory() {
                JSONObject out = new JSONObject();
                android.content.SharedPreferences prefs = getSharedPreferences("nico_watch_history_v2", MODE_PRIVATE);
                for (java.util.Map.Entry<String,?> e : prefs.getAll().entrySet()) {
                  try { out.put(e.getKey(), new JSONObject(String.valueOf(e.getValue()))); } catch(Exception ex) { }
                }
                return out.toString();
              }
              @JavascriptInterface public void playVod(String json, int i) {
                Intent t = new Intent(MainActivity.this, PlayerActivity.class);
                t.putExtra("list", json);
                t.putExtra("i", i);
                t.putExtra("vod", true);
                startActivity(t);
              }
              @JavascriptInterface public void playEpisodes(String json, int i) {
                Intent t = new Intent(MainActivity.this, PlayerActivity.class);
                t.putExtra("list", json);
                t.putExtra("i", i);
                t.putExtra("vod", true);
                t.putExtra("episodes", true);
                startActivity(t);
              }
              @JavascriptInterface public void play(String json, int i) {
                Intent t = new Intent(MainActivity.this, PlayerActivity.class);
                t.putExtra("list", json);
                t.putExtra("i", i);
                startActivity(t);
              }
            }
            private static final String NICO_RELEASE_API = "https://api.github.com/repos/PlzCunha/Minha-TV/releases/latest";
            private static final String NICO_RELEASES_PAGE = "https://github.com/PlzCunha/Minha-TV/releases/latest";
            private volatile boolean nicoChecking = false;
            private volatile boolean nicoDownloading = false;

            private void nicoMessage(String title, String message) {
              runOnUiThread(() -> new AlertDialog.Builder(this)
                .setTitle(title).setMessage(message)
                .setPositiveButton("OK", (dialog, which) -> dialog.dismiss())
                .show());
            }
            private int releaseNumber(String tag) {
              if (tag == null || !tag.matches("v[0-9]+")) return -1;
              try { return Integer.parseInt(tag.substring(1)); } catch (Exception e) { return -1; }
            }
            private int installedNicoRun() {
              try {
                if (Build.VERSION.SDK_INT >= 28) return (int)(getPackageManager().getPackageInfo(getPackageName(), 0).getLongVersionCode() - 10000L);
                return getPackageManager().getPackageInfo(getPackageName(), 0).versionCode - 10000;
              } catch (Exception e) { return -1; }
            }
            private String fetchJson(String address) throws Exception {
              HttpURLConnection c = (HttpURLConnection)new URL(address).openConnection();
              c.setConnectTimeout(12000);
              c.setReadTimeout(15000);
              c.setRequestProperty("Accept", "application/vnd.github+json");
              c.setRequestProperty("User-Agent", "NicoTV-Android-Updater");
              try {
                int status = c.getResponseCode();
                if (status != 200) throw new IOException("GitHub HTTP " + status + ". Confira se ha Releases publicas disponiveis.");
                try(InputStream in = c.getInputStream()) {
                  byte[] b = new byte[8192]; int n; java.io.ByteArrayOutputStream out = new java.io.ByteArrayOutputStream();
                  while((n=in.read(b)) != -1) {out.write(b,0,n); if(out.size()>512*1024)throw new IOException("Resposta do GitHub excessiva");}
                  return out.toString("UTF-8");
                }
              } finally { c.disconnect(); }
            }
            private void checkForNicoUpdates() {
              if (nicoChecking || nicoDownloading) return;
              nicoChecking = true;
              new Thread(() -> {
                try {
                  // Consulta varias Releases: uma Release recente sem APK nao deve bloquear
                  // uma versao anterior valida, nem oferecer um arquivo inexistente.
                  JSONArray releases = new JSONArray(fetchJson("https://api.github.com/repos/PlzCunha/Minha-TV/releases?per_page=20"));
                  int installed = installedNicoRun();
                  if (installed < 0) throw new IOException("Nao foi possivel identificar a versao instalada.");
                  int newestValid = -1;
                  String apkUrl = null;
                  final String expectedPrefix = "https://github.com/PLzCunha/Minha-TV/releases/download/";
                  for (int i=0;i<releases.length();i++) {
                    JSONObject release = releases.optJSONObject(i);
                    if (release == null || release.optBoolean("draft") || release.optBoolean("prerelease")) continue;
                    int number = releaseNumber(release.optString("tag_name", ""));
                    if (number < 0 || number <= newestValid) continue;
                    JSONArray assets = release.optJSONArray("assets");
                    if (assets == null) continue;
                    String candidate = null;
                    for (int j=0;j<assets.length();j++) {
                      JSONObject asset = assets.optJSONObject(j);
                      if (asset == null || !"uploaded".equals(asset.optString("state", "uploaded"))) continue;
                      String name = asset.optString("name", "");
                      String url = asset.optString("browser_download_url", "");
                      if (name.toLowerCase(java.util.Locale.ROOT).endsWith(".apk")
                          && url.startsWith(expectedPrefix)
                          && asset.optLong("size", 0) > 100000) {
                        if (candidate == null || "nicotv.apk".equalsIgnoreCase(name)) candidate = url;
                        if ("nicotv.apk".equalsIgnoreCase(name)) break;
                      }
                    }
                    if (candidate != null) { newestValid=number; apkUrl=candidate; }
                  }
                  if (newestValid < 0) throw new IOException("Nenhuma Release publicada contem um APK valido. Verifique a etapa Publicar do GitHub Actions.");
                  final int latest = newestValid;
                  final String validApkUrl = apkUrl;
                  runOnUiThread(() -> {
                    if (latest > installed) {
                      new AlertDialog.Builder(this)
                        .setTitle("Atualizacao disponivel")
                        .setMessage("Versao instalada: " + installed + "\nNova versao: " + latest + "\n\nDeseja baixar e instalar a atualizacao da Nico TV?")
                        .setNegativeButton("Agora nao", (d,w) -> d.dismiss())
                        .setPositiveButton("Baixar", (d,w) -> downloadNicoUpdate(validApkUrl))
                        .show();
                    } else {
                      nicoMessage("Nico TV atualizada", "Voce ja esta na versao mais recente (" + installed + ").");
                    }
                  });
                } catch(Exception e) {
                  nicoMessage("Nao foi possivel verificar", String.valueOf(e.getMessage()) + "\n\nConfira sua conexao e se ha uma Release no GitHub.");
                } finally { nicoChecking = false; }
              }, "NicoTV-CheckUpdate").start();
            }
            private void downloadNicoUpdate(String downloadUrl) {
              if(nicoDownloading) return;
              if (Build.VERSION.SDK_INT >= 26 && !getPackageManager().canRequestPackageInstalls()) {
                new AlertDialog.Builder(this).setTitle("Permitir instalacao")
                  .setMessage("Autorize a Nico TV a instalar atualizacoes. Depois, abra Verificar atualizacoes novamente.")
                  .setNegativeButton("Cancelar", (d,w) -> d.dismiss())
                  .setPositiveButton("Abrir configuracoes", (d,w) -> {
                    try { startActivity(new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:"+getPackageName()))); }
                    catch(Exception e) { nicoMessage("Permissao", "Habilite instalacao de aplicativos desconhecidos para Nico TV nas configuracoes do Fire TV."); }
                  }).show();
                return;
              }
              nicoDownloading = true;
              nicoMessage("Baixando atualizacao", "O download comecou. O instalador sera aberto quando terminar.");
              new Thread(() -> {
                HttpURLConnection c = null;
                try {
                  File dir = new File(getExternalFilesDir(null), "updates");
                  if(!dir.exists() && !dir.mkdirs())throw new IOException("Nao foi possivel criar a pasta de atualizacoes");
                  File apk = new File(dir, "nicotv-update.apk");
                  c=(HttpURLConnection)new URL(downloadUrl).openConnection();
                  c.setConnectTimeout(20000); c.setReadTimeout(60000);
                  c.setRequestProperty("User-Agent", "NicoTV-Android-Updater");
                  if(c.getResponseCode()!=200)throw new IOException("Erro ao baixar APK: HTTP " + c.getResponseCode());
                  long expected = c.getContentLengthLong();
                  long received = 0;
                  try(InputStream input=c.getInputStream(); FileOutputStream output=new FileOutputStream(apk)) {
                    byte[] buffer=new byte[32768]; int n;
                    while((n=input.read(buffer))!=-1){output.write(buffer,0,n); received+=n;}
                  }
                  if(received<100000 || (expected>0 && expected!=received))throw new IOException("Download incompleto: " + received + " bytes");
                  final File ready = apk;
                  runOnUiThread(() -> {
                    try {
                      Uri uri=FileProvider.getUriForFile(this,getPackageName()+".fileprovider",ready);
                      Intent install=new Intent(Intent.ACTION_VIEW);
                      install.setDataAndType(uri,"application/vnd.android.package-archive");
                      install.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(install);
                    } catch(Exception e) {
                      nicoMessage("Instalador indisponivel", "APK baixado, mas o Fire TV nao abriu o instalador: " + e.getMessage());
                    }
                  });
                } catch(Exception e) {
                  nicoMessage("Falha no download", String.valueOf(e.getMessage()) + "\n\nConfira a conexao e tente novamente.");
                } finally { if(c!=null)c.disconnect(); nicoDownloading=false; }
              }, "NicoTV-DownloadUpdate").start();
            }

            String fetch(String u, int n) throws Exception {
              HttpURLConnection c = (HttpURLConnection) new URL(u).openConnection();
              c.setInstanceFollowRedirects(false);
              c.setConnectTimeout(15000);
              c.setReadTimeout(60000);
              c.setRequestProperty("User-Agent", "NicoTV/1.2 (Android)");
              int code = c.getResponseCode();
              if (code >= 300 && code < 400 && n < 5) {
                String l = c.getHeaderField("Location");
                if (l != null) return fetch(new URL(new URL(u), l).toString(), n + 1);
              }
              if (code >= 400) throw new IOException("HTTP " + code);
              BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream(), "UTF-8"));
              StringBuilder sb = new StringBuilder();
              char[] buf = new char[16384];
              int k;
              while ((k = r.read(buf)) > 0) sb.append(buf, 0, k);
              r.close();
              return sb.toString();
            }
            @Override protected void onResume() {
              super.onResume();
              if(w != null)w.post(() -> w.evaluateJavascript("window.nicoNativeHistoryChanged&&window.nicoNativeHistoryChanged()",null));
            }
            @Override public void onBackPressed() {
              w.evaluateJavascript("(window.__back&&window.__back())?'1':'0'", v -> { if (!"\"1\"".equals(v)) finish(); });
            }
          }
          MAINACTIVITY
          cat > app/src/main/java/com/nicotv/app/PlayerActivity.java <<'PLAYERACTIVITY'
          package com.nicotv.app;
          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.graphics.drawable.GradientDrawable;
          import android.view.KeyEvent;
          import android.view.WindowManager;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.content.SharedPreferences;
          import android.widget.TextView;
          import android.view.View;
          import androidx.media3.common.C;
          import androidx.media3.common.Format;
          import androidx.media3.common.Tracks;
          import androidx.media3.common.TrackSelectionOverride;
          import androidx.media3.common.TrackSelectionParameters;
          import android.app.AlertDialog;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.PlaybackException;
          import androidx.media3.common.Player;
          import androidx.media3.datasource.DefaultHttpDataSource;
          import androidx.media3.datasource.HttpDataSource;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.exoplayer.DefaultRenderersFactory;
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory;
          import androidx.media3.ui.PlayerView;
          import androidx.media3.ui.AspectRatioFrameLayout;
          import org.json.JSONArray;
          import org.json.JSONObject;
          public class PlayerActivity extends Activity {
            ExoPlayer p; PlayerView pv; TextView title; TextView status; TextView footer; JSONArray list; int i; boolean vod; boolean episodes; LinearLayout controls; TextView playControl; TextView nextControl; TextView nextPrompt; Runnable autoNext; int countDown; SeekBar timeline; TextView elapsed; TextView durationLabel; LinearLayout timelineBox; boolean seekingTimeline=false; String mediaKey=null; long lastPositionSave=0;
            FrameLayout panel; ScrollView panelScroll; LinearLayout panelRows; boolean panelVisible = false; int selection = 0; int previousChannel = -1; TextView previousControl;
            Handler h = new Handler();
            boolean overlayVisible = false; boolean expandedVideo = false; TextView fullscreenControl;
            java.util.ArrayList<TextView> tvButtons = new java.util.ArrayList<>();
            java.util.ArrayList<Runnable> tvButtonActions = new java.util.ArrayList<>();
            int selectedControl = -1; boolean seekBarSelected = false;
            boolean remoteOkHandled = false;
            boolean resumedCurrentItem = false;
            boolean trackDialogVisible = false;
            boolean liveTsFallbackTried = false;

            Runnable hide = () -> {
              if (selectedControl >= 0 || seekBarSelected || (p != null && vod && !p.getPlayWhenReady())) return;
              overlayVisible = false;
              title.setVisibility(View.GONE);
              footer.setVisibility(View.GONE);
              controls.setVisibility(View.GONE);
              timelineBox.setVisibility(View.GONE);
            };
            Runnable progressTick = new Runnable() { @Override public void run() {
              if(p == null)return;
              refreshTimeline();savePosition(false);
              h.postDelayed(this,1000);
            }};
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              FrameLayout root = new FrameLayout(this);
              root.setBackgroundColor(Color.BLACK);
              pv = new PlayerView(this);
              pv.setUseController(false);
              root.addView(pv);

              title = new TextView(this);
              title.setTextColor(Color.WHITE);
              title.setTextSize(24);
              GradientDrawable titleBg = new GradientDrawable();
              titleBg.setColor(0xD4090909);
              titleBg.setCornerRadius(dp(12));
              title.setBackground(titleBg);
              title.setPadding(34, 22, 34, 22);
              root.addView(title, new FrameLayout.LayoutParams(-1, -2, Gravity.TOP));

              footer = new TextView(this);
              footer.setTextColor(0xFFE6F0F6);
              footer.setTextSize(15);
              GradientDrawable footerBg = new GradientDrawable();
              footerBg.setColor(0xD90F0D0A);
              footerBg.setCornerRadius(dp(12));
              footerBg.setStroke(dp(1),0x668D6427);
              footer.setBackground(footerBg);
              footer.setPadding(28, 16, 28, 16);
              FrameLayout.LayoutParams fp = new FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM|Gravity.CENTER_HORIZONTAL);
              fp.bottomMargin = 88;
              root.addView(footer, fp);
              footer.setVisibility(android.view.View.INVISIBLE);

              timelineBox = new LinearLayout(this);
              timelineBox.setOrientation(LinearLayout.VERTICAL);
              timelineBox.setPadding(dp(18),dp(9),dp(18),dp(10));
              GradientDrawable timelineBg = new GradientDrawable();
              timelineBg.setColor(0xEB0E0C09);
              timelineBg.setCornerRadius(dp(17));
              timelineBg.setStroke(dp(1),0x998B6429);
              timelineBox.setBackground(timelineBg);
              FrameLayout.LayoutParams tlp = new FrameLayout.LayoutParams(-1,-2,Gravity.BOTTOM);
              tlp.bottomMargin = dp(92);
              tlp.leftMargin = dp(18);
              tlp.rightMargin = dp(18);
              root.addView(timelineBox,tlp);
              timeline = new SeekBar(this);
              timeline.setMax(1000);
              timeline.setFocusable(false);
              timeline.setSplitTrack(false);
              timeline.setProgressBackgroundTintList(android.content.res.ColorStateList.valueOf(0xFF4A3925));
              timeline.setProgressTintList(android.content.res.ColorStateList.valueOf(0xFFE4C16D));
              timeline.setThumbTintList(android.content.res.ColorStateList.valueOf(0xFFE4C16D));
              timelineBox.addView(timeline,new LinearLayout.LayoutParams(-1,dp(26)));
              LinearLayout timeRow = new LinearLayout(this);
              timeRow.setGravity(Gravity.CENTER_VERTICAL);
              elapsed = new TextView(this);durationLabel=new TextView(this);
              elapsed.setTextColor(0xFFFFD36B);durationLabel.setTextColor(0xFFE4D9C9);
              elapsed.setTextSize(15);durationLabel.setTextSize(15);
