<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nico TV v1.6.0 • Premium Experience</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e14;
  --bg2:#101723;
  --panel:#121926;
  --panel2:#182132;
  --line:#29364d;
  --text:#f4f7fb;
  --muted:#93a2b8;
  --gold:#e4c16d;
  --gold2:#c79d48;
  --cyan:#74d9ff;
  --cyan2:#2cb7e6;
  --good:#46d2a0;
  --danger:#ff7575;
  --focus:#f6d17b;
  --shadow:0 18px 50px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
 radial-gradient(1200px 500px at 90% -10%, rgba(228,193,109,.16), transparent 55%),
 radial-gradient(800px 400px at 10% 0%, rgba(116,217,255,.10), transparent 55%),
 linear-gradient(180deg,#090d13,#0b1018 20%,#090d14);
 color:var(--text);font:400 16px/1.45 Manrope,system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{text-decoration:none;color:inherit}
:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;box-shadow:0 0 0 8px rgba(228,193,109,.12)}
.shell{display:grid;grid-template-columns:108px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid #1f2b3f;background:linear-gradient(180deg,#0b1017,#0d1320 70%,#0a0f17);display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;justify-content:center;height:78px;border-radius:20px;background:linear-gradient(145deg,#172236,#0f1623);border:1px solid #253248;color:var(--text);font-weight:800;letter-spacing:.02em;font-size:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.logo img{display:block;width:100%;max-width:67px;aspect-ratio:1;object-fit:contain;border-radius:16px}
.logo small{display:block;font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.22em;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:10px}
.navbtn{height:54px;border-radius:18px;background:linear-gradient(145deg,#121a29,#0e1520);border:1px solid #223046;color:#d7deea;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .16s,border-color .16s,background .16s}
.navbtn .ico{font-size:20px}
.navbtn.active,.navbtn[aria-pressed=true]{background:linear-gradient(145deg,#2a2518,#181611);border-color:#6d5931;color:#fff;box-shadow:0 10px 30px rgba(228,193,109,.10)}
.navbtn:hover{transform:translateY(-1px);border-color:#3d4f6b}
.navlabel{position:absolute;left:66px;background:#09101bcc;border:1px solid #2a3a54;color:#eef4f8;padding:8px 12px;border-radius:12px;white-space:nowrap;opacity:0;pointer-events:none;transform:translateX(-8px);transition:.16s;font-size:14px;font-weight:700;backdrop-filter:blur(8px)}
.navbtn:hover .navlabel,.navbtn:focus-visible .navlabel{opacity:1;transform:translateX(0)}
.sidebar .spacer{flex:1}
.main{padding:22px 28px 28px;min-width:0}
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.brandpanel{display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:28px;background:linear-gradient(145deg,rgba(18,27,41,.92),rgba(10,16,25,.78));border:1px solid #23324a;box-shadow:0 12px 32px rgba(0,0,0,.26),inset 0 1px 0 rgba(255,255,255,.04)}
.brandvisual{display:flex;flex-direction:column;gap:8px;min-width:min(46vw,580px)}
.brandbanner{display:block;width:min(46vw,540px);max-width:100%;height:auto;border-radius:18px;object-fit:contain;box-shadow:0 10px 24px rgba(0,0,0,.24)}
.brandcopy{display:flex;flex-direction:column;gap:4px;min-width:0}
.brand-eyebrow{font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#8ea0ba}
.appname{font-size:34px;font-weight:900;letter-spacing:-.05em;line-height:.95;display:flex;align-items:baseline;gap:2px}
.appname .muted{color:var(--gold)}
.subtitle{color:var(--muted);font-size:14px;margin-top:0;padding-left:2px}
.searchwrap{margin-left:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:10px;min-width:280px;max-width:540px;flex:1;background:linear-gradient(145deg,#101826,#121d2d);border:1px solid #27364d;border-radius:18px;padding:0 14px;height:54px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.search input{width:100%;background:none;border:0;color:var(--text)}
.metric-pill{padding:10px 14px;border-radius:14px;background:#0f1622;border:1px solid #223046;color:#cdd7e5;font-size:13px;font-weight:700}
.page-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:50px;padding:0 16px;border-radius:16px;border:1px solid #2a3950;background:linear-gradient(145deg,#121a29,#0d1420);color:#f1f5fb;font-weight:700;transition:.16s}
.btn:hover{transform:translateY(-1px);border-color:#3a4e68}
.btn.main{background:linear-gradient(145deg,var(--gold),#cfab5d);border-color:#cfab5d;color:#1c1407}
.btn.ghost{background:#0f1622}
.btn.soft{background:linear-gradient(145deg,#132234,#102031);border-color:#294257;color:#d6eff8}
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.9fr);gap:20px;padding:28px;border-radius:28px;background:linear-gradient(135deg,#131c2b,#121621 55%,#0e131d);border:1px solid #26334a;box-shadow:var(--shadow)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:999px;pointer-events:none}
.hero:before{width:360px;height:360px;right:-80px;top:-110px;background:radial-gradient(circle,rgba(228,193,109,.22),transparent 65%)}
.hero:after{width:320px;height:320px;left:-120px;bottom:-160px;background:radial-gradient(circle,rgba(116,217,255,.12),transparent 68%)}
.hero-copy,.hero-media{position:relative;z-index:1}
.kicker{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border-radius:999px;background:#101927;border:1px solid #26354d;color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.hero h1{margin:16px 0 10px;font-size:clamp(34px,5vw,56px);line-height:.98;letter-spacing:-.05em}
.hero h1 .accent{color:var(--gold)}
.hero p{margin:0 0 18px;color:#c7d3e1;max-width:760px}
.hero-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chip{padding:8px 12px;border-radius:999px;background:#111b2a;border:1px solid #294057;color:#dbe7f0;font-size:13px;font-weight:700}
.chip.accent{background:#1f1a10;border-color:#5f4c2b;color:#ffe0a0}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.hero-media{display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.media-card{min-height:210px;border-radius:24px;padding:18px;background:linear-gradient(145deg,#101825,#162236);border:1px solid #294257;display:flex;gap:18px;align-items:flex-end;justify-content:space-between;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.media-thumb{width:min(34%,150px);aspect-ratio:2/3;border-radius:18px;background:linear-gradient(180deg,#4f2f68,#1e325f);border:1px solid #38506f;overflow:hidden;display:grid;place-items:center}
.media-thumb img{width:100%;height:100%;object-fit:cover}
.media-info{flex:1;min-width:0}
.media-title{font-size:28px;font-weight:800;letter-spacing:-.04em}
.media-sub{color:var(--muted);font-size:14px;margin-top:6px}
.media-lines{display:grid;gap:10px;margin-top:16px}
.media-line{height:8px;border-radius:999px;background:linear-gradient(90deg,rgba(228,193,109,.8),rgba(228,193,109,.22));width:100%}
.media-line.small{width:62%}
.media-line.tiny{width:35%}
.control-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0 8px}
.control-card{border-radius:22px;background:linear-gradient(145deg,#121a29,#0f1521);border:1px solid #24334b;padding:18px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.control-card .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;font-weight:800}
.control-card .value{font-size:30px;font-weight:800;letter-spacing:-.04em}
.section{margin-top:18px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
.section-title{font-size:28px;font-weight:800;letter-spacing:-.04em}
.section-sub{color:var(--muted);font-size:14px}
.row{margin-top:18px}
.row-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.row-title-btn,.row-title{font:800 22px/1 Manrope,sans-serif;color:var(--text);letter-spacing:-.03em}
.row-title-btn{background:none;border:0;padding:0}
.row-title-btn:hover{color:#fff}
.row-subcount{font-size:13px;color:var(--muted)}
.strip{display:flex;gap:14px;overflow:auto;padding:2px 2px 8px;scrollbar-width:none;scroll-padding:20px}.strip::-webkit-scrollbar{display:none}
.card{position:relative;flex:none;width:220px;border-radius:22px;padding:14px;background:linear-gradient(145deg,#151e2d,#101723);border:1px solid #26354d;box-shadow:var(--shadow);transition:transform .16s,border-color .16s,box-shadow .16s}
.card:hover,.card:focus{transform:translateY(-2px) scale(1.02);border-color:#c9a85f;box-shadow:0 20px 45px rgba(0,0,0,.5),0 0 0 1px rgba(228,193,109,.2)}
.card.poster{width:180px}.card.poster .thumb{aspect-ratio:2/3}
.thumb{width:100%;aspect-ratio:16/9;border-radius:16px;background:linear-gradient(145deg,#1a2740,#101621);border:1px solid #2c3e59;overflow:hidden;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .placeholder{font-size:34px;color:#d4b369}
.card-body{padding-top:12px}
.card-title{font-size:18px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:13px;color:var(--muted);margin-top:4px;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-epg{margin-top:10px;padding:8px 10px;border-radius:12px;background:#111924;border:1px solid #23344b;font-size:12px;color:#dce7f1;min-height:46px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.card-epg .next{color:#95b6c6}
.card-actions{display:flex;gap:8px;margin-top:12px}
.mini{padding:8px 12px;border-radius:12px;background:#101826;border:1px solid #26364f;font-size:12px;font-weight:800;color:#d9e5f0}
.mini.play{background:linear-gradient(145deg,var(--gold),#cfab5d);border-color:#cfa85d;color:#1e1609}
.favstar{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#09111bdd;border:1px solid #33435e;color:var(--gold);font-size:18px;z-index:2}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.empty{padding:18vh 6vw;text-align:center;color:var(--muted)}.empty h2{font-size:34px;color:#fff;letter-spacing:-.04em;margin:0 0 10px}
.detail{display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px}
.detail-side,.detail-main{border-radius:26px;background:linear-gradient(145deg,#121a29,#101723);border:1px solid #24354c;box-shadow:var(--shadow)}
.detail-side{padding:20px;display:flex;flex-direction:column;gap:18px}
.poster-lg{width:100%;aspect-ratio:2/3;border-radius:22px;background:linear-gradient(180deg,#503069,#204575);border:1px solid #395372;overflow:hidden}.poster-lg img{width:100%;height:100%;object-fit:cover}
.detail-title{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1}
.detail-sub{color:var(--muted)}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.detail-main{padding:22px}
.season-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.season-btn{padding:10px 14px;border-radius:14px;background:#101826;border:1px solid #2a3b54;color:#d8e3ee;font-weight:800}
.season-btn.active{background:linear-gradient(145deg,var(--gold),#cfab5d);border-color:#cfab5d;color:#1c1407}
.ep-list{display:grid;gap:10px}
.ep-item{padding:14px 16px;border-radius:16px;background:#0f1622;border:1px solid #23344d;display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:14px;align-items:center;transition:.16s}
.ep-item:hover,.ep-item:focus{border-color:#cfa85d;transform:translateY(-1px)}
.ep-thumb{height:54px;border-radius:12px;background:linear-gradient(145deg,#235a7a,#46325c);border:1px solid #466174}
.ep-name{font-weight:800;letter-spacing:-.02em}
.ep-meta{font-size:13px;color:var(--muted)}
#player{position:fixed;inset:0;z-index:40;background:#000;display:none}
#player.on{display:block}
#player video{width:100%;height:100%;background:#000}
#playerBar{position:absolute;left:0;right:0;top:0;padding:18px 24px;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);display:flex;align-items:flex-start;justify-content:space-between;gap:18px;transition:opacity .25s}
#playerBar.hide{opacity:0;pointer-events:none}
.player-meta{display:grid;gap:6px;max-width:min(70vw,860px)}
#playerTitle{font-size:28px;font-weight:800;letter-spacing:-.04em}
#playerSub{font-size:14px;color:#d8e5ef}
.player-actions{display:flex;gap:10px;flex-wrap:wrap}
#playerMsg{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#fff;text-align:center;padding:20px;font-size:24px;text-shadow:0 2px 10px rgba(0,0,0,.8);white-space:pre-line}

/* Nico TV 1.3.13 — tempo, busca e retomada */
#playbackTimeline{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);width:min(94vw,820px);z-index:13;border:1px solid rgba(228,193,109,.42);border-radius:16px;background:rgba(9,16,28,.94);padding:12px 16px;box-shadow:0 12px 34px #0009;display:grid;gap:7px}
#playbackTimeline[hidden]{display:none!important}
#playbackTimeline input[type=range]{width:100%;height:18px;accent-color:#e4c16d;cursor:pointer}
#playbackTimeline input[type=range]:disabled{cursor:default;opacity:.5}
.timeline-info{display:flex;justify-content:space-between;align-items:center;color:#e8eaf0;font-size:14px;font-variant-numeric:tabular-nums}
.timeline-info strong{color:#e4c16d;font-size:15px}
@media(max-width:650px){#playbackTimeline{bottom:136px;width:96vw;padding:9px}.timeline-info{font-size:12px}}

#webcontrols{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#webcontrols .btn{background:#122036cc;backdrop-filter:blur(8px)}
#webcontrols{transition:opacity .2s;z-index:12;bottom:22px;width:min(96vw,760px);padding:12px;border:1px solid #665332;background:rgba(9,16,28,.94);border-radius:22px;box-shadow:0 16px 50px #000b;align-items:center}
#webcontrols .btn{min-width:48px;cursor:pointer}
#webcontrols .btn:disabled{opacity:.4;cursor:not-allowed}
#webcontrols .btn.main{background:#e4c16d;color:#1a1408}
#nextEpisodeCard{position:absolute;right:22px;bottom:112px;z-index:15;background:#0e1826ee;color:#fff;border:1px solid #d4ae60;border-radius:18px;padding:16px;max-width:min(430px,85vw);box-shadow:0 16px 44px #000b}
#nextEpisodeCard[hidden]{display:none}
#nextEpisodeCard .title{font-weight:800;font-size:18px;margin-bottom:6px}
#nextEpisodeCard .actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
#player video{object-fit:contain}
#player.controls-hidden #webcontrols{opacity:0;pointer-events:none}
#player:fullscreen{width:100vw;height:100vh;background:#000}
#player:-webkit-full-screen{width:100vw;height:100vh;background:#000}
.player-actions{max-width:70vw;justify-content:flex-end}
.player-actions .btn{min-height:42px;padding:0 12px;font-size:13px;background:#101a2dcc;border-color:#344662}
.track-panel{position:absolute;right:24px;top:100px;width:min(390px,80vw);max-height:calc(100vh - 140px);background:rgba(9,14,24,.94);border:1px solid #33425b;box-shadow:0 16px 40px #000a;border-radius:20px;padding:16px;z-index:9;overflow-y:auto}
.track-panel[hidden]{display:none}
.track-options{display:grid;gap:8px;margin-top:10px}
.track-option{border:1px solid #2b3a52;background:#172031;color:#f4f6fc;border-radius:12px;text-align:left;padding:12px;min-height:42px}
.track-option.selected{border-color:#dfb962;background:#302718;color:#fbe6aa}
.track-note{color:#9eacc3;font-size:13px;padding:10px 2px}
#playerMsg{z-index:2}
#drawer{z-index:5}
#playerBar{z-index:7}
#webcontrols{z-index:7}
#drawer{position:absolute;right:24px;top:92px;bottom:96px;width:min(360px,42vw);background:rgba(10,14,20,.88);backdrop-filter:blur(12px);border:1px solid #273754;border-radius:24px;padding:16px;display:none;box-shadow:var(--shadow)}
#drawer.on{display:flex;flex-direction:column}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.drawer-title{font-size:18px;font-weight:800}
.drawer-list{overflow:auto;display:grid;gap:8px;padding-right:4px}
.drawer-item{padding:12px 14px;border-radius:14px;background:#111a27;border:1px solid #22334c;display:grid;gap:4px}
.drawer-item.active{background:linear-gradient(145deg,#2a2416,#15120c);border-color:#caa75f}
.drawer-item .small{font-size:12px;color:#97aabd}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:12px 18px;border-radius:14px;background:#152333;border:1px solid #29455b;color:#e8f6fb;z-index:120;opacity:0;pointer-events:none;transition:opacity .16s}
#toast.show{opacity:1}
.hidden{display:none!important}
dialog{background:linear-gradient(145deg,#111926,#0d131f);color:var(--text);border:1px solid #26364d;border-radius:24px;width:min(620px,94vw);padding:22px;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 12px;font-size:28px;letter-spacing:-.04em}
.tabs{display:flex;gap:10px;margin-bottom:14px}
.tabs .btn[aria-pressed=true]{background:linear-gradient(145deg,var(--gold),#cfab5d);border-color:#cfab5d;color:#1a1206}
label{display:block;margin:12px 0 6px;font-size:13px;color:#dce7f1;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
input[type=text],input[type=url],input[type=password],textarea{width:100%;border-radius:16px;border:1px solid #26364e;background:#0d1420;padding:14px 16px;color:var(--text)}
textarea{min-height:96px;resize:vertical}
.pane{display:none}.pane.on{display:block}.row2{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.hint{font-size:13px;color:var(--muted);margin-top:10px}#err{color:#ffd0d0;min-height:1.2em;margin-top:12px}
@media (max-width:1100px){
  .shell{grid-template-columns:88px minmax(0,1fr)}
  .hero{grid-template-columns:1fr}
  .control-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .detail{grid-template-columns:1fr}
}
@media (max-width:780px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:sticky;height:auto;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));padding:12px;border-right:0;border-bottom:1px solid #1f2b3f;gap:10px}
  .logo{grid-column:1/-1;height:78px;padding:8px}
  .nav{display:contents}.sidebar .spacer{display:none}.navlabel{display:none}
  .main{padding:16px}.topbar{align-items:flex-start}.brandpanel{width:100%}.brandvisual{min-width:0;width:100%}.brandbanner{width:100%}.searchwrap{margin-left:0;width:100%}.search{max-width:none;min-width:0}.appname{font-size:28px}.control-grid{grid-template-columns:1fr}.card{width:200px}.card.poster{width:160px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* v1.3.9 — Guia premium e metadados */
.guide-modal{border:1px solid #374965;background:#0b1423;color:#edf3fa;border-radius:22px;width:min(1120px,94vw);max-height:88vh;padding:0;box-shadow:0 24px 90px #000b}
.guide-modal::backdrop{background:#02050bdc}
.guide-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;border-bottom:1px solid #30405b;position:sticky;top:0;background:#101b2c;z-index:1}
.guide-header h2{margin:0;font-size:23px;color:#e9c879}
.guide-content{overflow:auto;max-height:70vh;padding:15px 22px 25px}
.guide-channel{border:1px solid #263a52;background:#111e30;border-radius:15px;margin:12px 0;overflow:hidden}
.guide-name{font-weight:750;padding:14px 17px;border-bottom:1px solid #2b3d54;display:flex;gap:12px;align-items:center}
.guide-programs{display:flex;overflow-x:auto;gap:10px;padding:12px}
.guide-program{min-width:220px;max-width:280px;flex:1;text-align:left;color:#e7effa;background:#16263b;border:1px solid #344764;border-radius:12px;padding:13px;cursor:pointer}
.guide-program.current{border-color:#dbb76a;background:#293045}
.guide-program strong,.guide-program small{display:block;margin-top:7px}
.guide-program small{font-size:12px;color:#acbfd1;line-height:1.45;max-height:5em;overflow:hidden}
.guide-progress{height:5px;border-radius:5px;background:#394c63;overflow:hidden;margin-top:12px}.guide-progress>span{display:block;background:#e8c674;height:100%}
.info-dialog{border:1px solid #354a65;background:linear-gradient(135deg,#16243a,#090f1b);color:#edf2fa;border-radius:22px;max-width:min(720px,92vw);padding:26px;box-shadow:0 22px 90px #000c}
.info-dialog::backdrop{background:#03060bde}.info-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.info-dialog h2{font-size:26px;margin:9px 0}.info-dialog p{color:#d0dbea;line-height:1.6}.info-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.info-chip{padding:6px 10px;border:1px solid #38506a;border-radius:30px;font-size:12px}
.guide-empty{padding:26px;color:#b8c9db;text-align:center}


/* Nico TV v1.3.15 — controles do player: uma única camada, compacta. */
#player #webcontrols{
 position:absolute!important;top:auto!important;right:auto!important;bottom:16px!important;
 left:50%!important;transform:translateX(-50%)!important;
 display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;
 align-items:center!important;justify-content:center!important;
 width:fit-content!important;max-width:calc(100% - 24px)!important;
 padding:6px 8px!important;gap:5px!important;height:auto!important;
 border:1px solid rgba(228,193,109,.27)!important;
 border-radius:14px!important;background:rgba(8,14,25,.84)!important;
 box-shadow:0 10px 30px #000a!important;
 z-index:13!important;
 transition:opacity .20s ease,visibility .20s ease!important;
}
#player #webcontrols button.btn{
 box-sizing:border-box!important;display:inline-flex!important;
 flex:0 0 auto!important;width:auto!important;min-width:0!important;max-width:none!important;
 height:34px!important;min-height:34px!important;max-height:34px!important;
 padding:0 9px!important;margin:0!important;
 font-size:12px!important;line-height:1!important;font-weight:700!important;
 align-items:center!important;justify-content:center!important;white-space:nowrap!important;border-radius:9px!important;
}
#player #webcontrols button.btn.main{min-width:78px!important}
#player #webcontrols button[hidden]{display:none!important}
#player #playbackTimeline{
 position:absolute!important;left:50%!important;right:auto!important;bottom:66px!important;
 transform:translateX(-50%)!important;width:min(710px,calc(100vw - 28px))!important;
 max-width:calc(100% - 28px)!important;padding:8px 12px!important;gap:3px!important;
 background:rgba(8,14,25,.82)!important;border-radius:12px!important;
 z-index:13!important;transition:opacity .20s ease,visibility .20s ease!important;
}
#player #playbackTimeline[hidden]{display:none!important}
#player.controls-hidden #webcontrols,#player.controls-hidden #playbackTimeline,#player.controls-hidden #playerBar{
 opacity:0!important;visibility:hidden!important;pointer-events:none!important;
}
#player.controls-hidden{cursor:none}
#player.controls-hidden #drawer,#player.controls-hidden #trackPanel,#player.controls-hidden #nextEpisodeCard{cursor:auto}
@media(max-width:680px){
 #player #webcontrols{bottom:8px!important;padding:4px!important;gap:3px!important}
 #player #webcontrols button.btn{font-size:11px!important;height:31px!important;min-height:31px!important;max-height:31px!important;padding:0 6px!important}
 #player #webcontrols button.btn.main{min-width:60px!important}
 #player #playbackTimeline{bottom:51px!important}
}


/* v1.3.16 - Campos otimizados para teclado virtual Fire TV */
.password-field{display:flex;align-items:stretch;gap:8px}
.password-field input{min-width:0;flex:1}
.password-field .password-toggle{flex:0 0 auto;padding:0 14px;min-height:50px}
#dlg input:focus-visible,#dlg textarea:focus-visible,#dlg button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#dlg{max-height:min(90vh,900px);overflow-y:auto;overscroll-behavior:contain}

/* Nico TV 1.4.0 — biblioteca pessoal */
.continue-grid{display:flex;gap:17px;overflow-x:auto;padding:8px 4px 19px;scroll-snap-type:x proximity}
.continue-card{flex:0 0 244px;min-width:0;background:#111b2b;border:1px solid #2d3b51;border-radius:20px;overflow:hidden;cursor:pointer;scroll-snap-align:start;color:#fff;text-align:left;padding:0;transition:border-color .18s,transform .18s}
.continue-card:focus-visible,.continue-card:hover{outline:3px solid #e4c16d;outline-offset:2px;transform:translateY(-2px)}
.continue-poster{height:123px;background:linear-gradient(120deg,#1b3041,#0e1522);position:relative;overflow:hidden}
.continue-poster img{width:100%;height:100%;object-fit:cover}
.continue-progress{height:5px;background:#46516a;position:absolute;bottom:0;left:0;right:0}
.continue-progress span{display:block;height:100%;background:#e4c16d}
.continue-detail{padding:12px 14px;display:grid;gap:5px}
.continue-title{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.continue-meta{font-size:12px;color:#a3b2c5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.continue-empty{color:#9caac0;font-size:14px}
.ep-item.completed{border-color:#3a654d}.ep-watch{color:#e4c16d;font-size:12px;margin-top:4px}.ep-item.completed .ep-watch{color:#87d4a8}
.ep-track{height:4px;border-radius:3px;background:#36455d;overflow:hidden;margin-top:8px;max-width:300px}.ep-track>span{height:100%;display:block;background:#e4c16d}
.history-chip{background:rgba(228,193,109,.10);border:1px solid #665533;color:#f0d28c;padding:8px 12px;border-radius:12px;display:inline-block;margin-top:6px}
@media(max-width:620px){.continue-card{flex-basis:190px}.continue-poster{height:104px}}

/* Nico TV 1.5.0: live filters with remote-friendly focus targets */
.live-filter-wrap{margin:12px 0 24px;padding:16px;border-radius:22px;border:1px solid #293a54;background:linear-gradient(120deg,#101b2b,#0d1421)}
.live-filter-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;color:#f4f6fa;font-weight:750;font-size:18px}
.live-filter-caption{font-size:12px;color:#a1b0c8;font-weight:500}
.live-filter-list{display:flex;gap:9px;overflow-x:auto;padding:5px 2px 12px;scrollbar-width:thin;scroll-snap-type:x proximity}
.live-filter-chip{scroll-snap-align:start;flex:0 0 auto;min-height:44px;border:1px solid #344967;border-radius:13px;background:#131f31;color:#e0e8f3;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.live-filter-chip.active{border-color:#e4c16d;background:#e4c16d;color:#171b22}
.live-filter-chip:focus-visible{outline:3px solid #f6e0a1;outline-offset:3px}
.live-filter-count{color:#9fb0c9;font-size:12px}
.catalog-filter-label{font-size:13px;color:#e4c16d;font-weight:800;margin:10px 2px 2px;letter-spacing:.03em}
.live-group-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live-filter-empty{padding:24px 10px;color:#a1b0c8}
@media(max-width:700px){.live-filter-wrap{padding:12px;border-radius:16px}.live-filter-chip{font-size:13px;min-height:42px;padding:8px 12px}}

/* v1.6.0 — Premium Experience: somente interface, sem alterar o ExoPlayer */
:root{--gold:#e8c77c;--focus:#ffe2a3;--shadow:0 16px 42px rgba(0,0,0,.36)}
html,body{background:#080d16;color:#f6f7fb}
.main{padding:22px clamp(18px,2.4vw,38px) 48px}
.topbar{gap:16px;margin-bottom:22px}
.brandpanel{background:#0d1623;border:1px solid #213045;border-radius:22px;padding:8px 13px}
.brandbanner{width:min(28vw,300px);max-height:88px;box-shadow:none}
.brandvisual{min-width:0;width:auto}
.subtitle{font-size:11px;color:#9faec2}
.sidebar{z-index:5;background:linear-gradient(180deg,#0c1522,#080e17);border-right-color:#25354c;box-shadow:4px 0 26px #0003}
.logo{border-radius:17px}
.navbtn{border-radius:14px;background:transparent;border-color:transparent}
.navbtn.active{background:#292619;border-color:#796232;box-shadow:inset 3px 0 0 #e8c77c}
.navbtn:focus-visible{border-color:#e8c77c;background:#342e1f}
.search{background:#101a29;border-color:#2c3d54}
.hero.cinema-hero{display:flex;align-items:center;isolation:isolate;min-height:clamp(340px,40vw,520px);padding:clamp(22px,4vw,58px);border-radius:24px;border:1px solid #334255;background:#101a29;box-shadow:0 24px 72px #0008;overflow:hidden}
.hero.cinema-hero:before,.hero.cinema-hero:after{display:none}
.cinema-backdrop,.cinema-shade{position:absolute;inset:0;pointer-events:none}
.cinema-backdrop{z-index:-2;overflow:hidden;background:radial-gradient(circle at 78% 34%,#344a5d 0,#171d2b 46%,#080e16 92%)}
.cinema-backdrop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:75% 33%;filter:brightness(.62) saturate(.85) blur(9px);transform:scale(1.1)}
.cinema-shade{z-index:-1;background:linear-gradient(90deg,#090f19 2%,rgba(9,15,25,.97) 26%,rgba(9,15,25,.72) 55%,rgba(9,15,25,.08) 100%),linear-gradient(0deg,rgba(8,13,22,.8),transparent 50%)}
.cinema-poster{position:absolute;right:clamp(20px,6vw,100px);top:50%;transform:translateY(-50%);width:min(21vw,230px);aspect-ratio:2/3;object-fit:cover;border-radius:16px;border:1px solid #ffffff55;box-shadow:0 25px 55px #0009;z-index:0}
.cinema-hero .hero-copy{z-index:1;width:min(66%,670px)}
.cinema-hero .kicker{letter-spacing:.14em;background:#1d2430d9;border-color:#735e36;color:#ffe2a0}
.cinema-hero h1{font-size:clamp(32px,4.3vw,61px);line-height:1.06;margin:18px 0;max-width:660px;overflow-wrap:anywhere;text-shadow:0 3px 25px #0008}
.cinema-hero h1 .accent{display:block;margin-top:10px;font-size:clamp(15px,1.7vw,21px);font-weight:700;color:#eed293;letter-spacing:0}
.cinema-description{max-width:550px;line-height:1.65;color:#dce3ec;font-size:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 4px #000a}
.cinema-hero .hero-actions{margin-top:22px}
.cinema-hero .hero-actions .btn{min-width:148px;min-height:49px;border-radius:12px}
.cinema-hero .hero-meta{margin:17px 0 0}
.cinema-hero .chip{background:#111a26c9;border:1px solid #5361747a;font-size:12px;padding:6px 11px}
.cinema-hero .chip.accent{color:#ffe0a2;border-color:#8f7449}
.cinema-fallback-art{position:absolute;right:12%;top:25%;font-size:clamp(80px,13vw,190px);color:#d3ae5b30;pointer-events:none}
.cinema-eyebrow{font-size:11px;font-weight:800;letter-spacing:.24em;color:#e7c77e;text-transform:uppercase}
.row{margin-top:26px}
.row-title{font-size:23px;letter-spacing:-.04em}
.row-subcount{margin-top:3px;color:#8f9db1}
.strip{gap:16px;padding:9px 4px 20px;scroll-snap-type:x proximity}
.card{scroll-snap-align:start;width:220px;padding:9px;border-radius:17px;background:#101927;border:1px solid #28394d;box-shadow:0 7px 19px #0003;transition:transform .2s,border-color .2s,box-shadow .2s}
.card.poster{width:192px}
.card .thumb{border-radius:12px;border:0;position:relative;background:linear-gradient(145deg,#203449,#121927)}
.card .thumb img{transition:transform .26s ease}
.card:is(:hover,:focus-visible,:focus-within) .thumb img{transform:scale(1.06)}
.card:is(:hover,:focus-visible,:focus-within){transform:translateY(-4px) scale(1.035);z-index:2;border-color:#e8c77c;box-shadow:0 0 0 2px #e8c77c77,0 18px 36px #000a}
.card .card-body{padding:10px 3px 4px}
.card .card-title{font-size:15px;font-weight:800}
.card .card-meta{font-size:11px;margin-top:3px}
.card .card-actions{margin-top:8px;gap:6px}
.card .mini{padding:8px 9px;border-radius:8px;font-size:11px}
.card .favstar{width:32px;height:32px;top:15px;right:15px;font-size:16px;background:#09101bdc}
.card-overlay-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-42%);height:48px;width:48px;border-radius:50%;display:grid;place-items:center;background:#e8c77cf2;color:#101723;font-size:24px;font-weight:800;box-shadow:0 8px 24px #0008;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none}
.card:is(:hover,:focus-visible,:focus-within) .card-overlay-play{opacity:1;transform:translate(-50%,-50%)}
.card-kind{position:absolute;left:7px;bottom:7px;background:#080e19dc;color:#e7cb89;border:1px solid #e7cb8944;border-radius:6px;padding:3px 7px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.grid{gap:16px}
.detail-side,.detail-main{background:#101825;border-color:#2b3b51}
.detail-title{line-height:1.12}
.section-head .section-title{font-size:26px}
.continue-card,.continue-item{transition:transform .16s,border-color .16s}
@media(max-width:1100px){.cinema-hero .hero-copy{width:72%}.cinema-poster{width:min(24vw,190px)}}
@media(max-width:780px){.main{padding:14px}.brandbanner{width:min(66vw,270px)}.hero.cinema-hero{min-height:400px;padding:24px}.cinema-hero .hero-copy{width:100%}.cinema-poster{width:36%;right:10px;opacity:.38}.cinema-shade{background:linear-gradient(90deg,#090f19 0%,#090f19e8 62%,#090f1950 100%)}.cinema-hero h1{font-size:36px}.cinema-description{font-size:13px}.card.poster{width:164px}.card{width:195px}.row-title{font-size:20px}}
@media(prefers-reduced-motion:reduce){.card,.card .thumb img,.card-overlay-play{transition:none!important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
// Usa a mesma imagem incorporada da barra lateral, antes de qualquer interação.
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const state={
  channels:[], movies:null, series:null, xt:null,
  mode:'live', view:null, detail:null, detailSeason:0,
  favorites:loadArray('nico_favorites'), recent:loadArray('nico_recent'),
  favoriteOnly:false, recentOnly:false, query:'', liveGroup:'all', liveRecent:loadArray('nico_live_recent'),
  catalogFilters:{movies:'all',series:'all'}, loading:false, queue:[], qi:0, hls:null, drawer:false, pageSize:60, vod:false, episodes:false, webTracks:false,
  epg:new Map(), epgSource:null, epgEntries:new Map(), tab:'m3u'
};
function loadArray(k){ try{ const a=JSON.parse(store.get(k)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function saveState(){ store.set('nico_favorites',JSON.stringify(state.favorites)); store.set('nico_recent',JSON.stringify(state.recent)); }
function keyOf(c){ return c.url || (c.kind==='series' ? 'series:'+c.id : c.kind==='movie' ? 'movie:'+c.url : c.name); }
function isFav(c){ return state.favorites.includes(keyOf(c)); }
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2400); }
function markRecent(c){ const k=keyOf(c); state.recent=[k,...state.recent.filter(x=>x!==k)].slice(0,40); saveState(); }
function markLiveRecent(c){
 if(!c?.url || c.kind==='movie' || c.kind==='ep' || c.kind==='series')return;
 const k=keyOf(c);state.liveRecent=[k,...state.liveRecent.filter(x=>x!==k)].slice(0,24);
 store.set('nico_live_recent',JSON.stringify(state.liveRecent));
}
function liveFiltered(list){
 if(state.mode!=='live')return list;
 if(state.liveGroup==='fav')return list.filter(isFav);
 if(state.liveGroup==='recent')return state.liveRecent.map(k=>list.find(c=>keyOf(c)===k)).filter(Boolean);
 if(state.liveGroup!=='all')return list.filter(c=>(c.group||'Outros')===state.liveGroup);
 return list;
}
function liveFilterPanel(app,unfiltered){
 if(state.mode!=='live'||state.view||state.detail)return;
 const groups=groupBy(unfiltered);const count=unfiltered.length;
 const host=document.createElement('section');host.className='live-filter-wrap';
 const headline=document.createElement('div');headline.className='live-filter-heading';
 headline.innerHTML='<span>📺 Explorar canais</span><span class="live-filter-caption">Selecione uma categoria pelo controle remoto</span>';
 const list=document.createElement('div');list.className='live-filter-list';list.setAttribute('aria-label','Filtros de canais');
 const values=[['all','Todos',count],['fav','★ Favoritos',unfiltered.filter(isFav).length],['recent','↺ Últimos vistos',state.liveRecent.filter(k=>unfiltered.some(c=>keyOf(c)===k)).length],...Array.from(groups,([group,items])=>[group,group,items.length])];
 values.forEach(([key,label,n])=>{
  const b=document.createElement('button');b.className='live-filter-chip'+(state.liveGroup===key?' active':'');b.type='button';
  b.textContent=label+' · '+n;b.setAttribute('aria-pressed',state.liveGroup===key?'true':'false');
  b.onclick=()=>{state.liveGroup=key;render();const next=[...document.querySelectorAll('.live-filter-chip')].find(x=>x.textContent===b.textContent);next?.focus({preventScroll:true});};
  list.append(b);
 });
 host.append(headline,list);app.append(host);
}
// Categorias Xtream e gêneros de metadados: cada catálogo tem seu filtro independente.
function catalogTokens(c){
  const value=String(c.genre||'');
  return value.split(/[,;/|]+/).map(v=>v.trim()).filter(v=>v.length>=2&&v.length<=55);
}
function catalogFiltered(list){
  if(state.mode!=='movies'&&state.mode!=='series')return list;
  const selected=state.catalogFilters[state.mode]||'all';
  if(selected==='all')return list;
  if(selected==='fav')return list.filter(isFav);
  if(selected==='recent')return state.recent.map(k=>list.find(c=>keyOf(c)===k)).filter(Boolean);
  if(selected.startsWith('cat:'))return list.filter(c=>(c.group||'Outros')===selected.slice(4));
  if(selected.startsWith('genre:'))return list.filter(c=>catalogTokens(c).some(g=>g.toLocaleLowerCase('pt-BR')===selected.slice(6)));
  return list;
}
function catalogFilterPanel(app,unfiltered){
  if(!['movies','series'].includes(state.mode)||state.view||state.detail)return;
  const mode=state.mode, chosen=state.catalogFilters[mode]||'all';
  const categories=new Map(),genres=new Map();
  unfiltered.forEach(c=>{
    const group=(c.group||'Outros').trim()||'Outros';
    categories.set(group,(categories.get(group)||0)+1);
    catalogTokens(c).forEach(g=>{const id=g.toLocaleLowerCase('pt-BR');const old=genres.get(id);genres.set(id,{name:old?.name||g,count:(old?.count||0)+1});});
  });
  const host=document.createElement('section');host.className='live-filter-wrap catalog-filter-wrap';
  const header=document.createElement('div');header.className='live-filter-heading';
  header.innerHTML='<span>'+(mode==='movies'?'🎬 Explorar filmes':'📺 Explorar séries')+'</span><span class="live-filter-caption">Gêneros e categorias · use o controle remoto</span>';

/* Parsing */
function parseM3U(text){
  let info=null; const out=[]; let epgUrl='';
  const lines=text.split(/\r?\n/);
  if(lines[0] && lines[0].startsWith('#EXTM3U')){
    const m=lines[0].match(/x-tvg-url="([^"]+)"/i) || lines[0].match(/url-tvg="([^"]+)"/i);
    if(m) epgUrl=m[1].trim();
  }
  for(const raw of lines){
    const line=raw.trim();
    if(line.startsWith('#EXTINF')){
      const attr = k => { const m=line.match(new RegExp(k+'="([^"]*)"','i')); return m?m[1]:''; };
      info={
        name: line.slice(line.lastIndexOf(',')+1).trim() || attr('tvg-name') || 'Sem nome',
        logo: attr('tvg-logo'),
        group: attr('group-title') || 'Outros',
        tvgId: attr('tvg-id') || attr('tvg-name') || ''
      };
    } else if(line && !line.startsWith('#') && info){ out.push({...info, url:line}); info=null; }
  }
  return { list:out, epgUrl };
}
function parseXmltvDate(v){
  if(!v) return null;
  const m=String(v).match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\s*([+\-]\d{4})?/);
  if(!m) return null;
  const [,Y,M,D,h,mn,s,off]=m;
  const iso=`${Y}-${M}-${D}T${h}:${mn}:${s}${off?off.slice(0,3)+':'+off.slice(3):''}`;
  const d=new Date(iso);
  return isNaN(d) ? null : d;
}
function timeFmt(d){ return d ? d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : ''; }
function parseEpg(xml){
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  const items=[...doc.querySelectorAll('programme')];
  const now=new Date();
  const buckets=new Map();
  for(const p of items){
    const start=parseXmltvDate(p.getAttribute('start')); const stop=parseXmltvDate(p.getAttribute('stop'));
    if(!start||!stop) continue;
    if(stop < new Date(now.getTime()-2*60*60*1000) || start > new Date(now.getTime()+18*60*60*1000)) continue;
    const ch=(p.getAttribute('channel')||'').trim(); if(!ch) continue;
    const title=(p.querySelector('title')?.textContent||'Sem título').trim();
    const entry={start,stop,title,desc:(p.querySelector('desc')?.textContent||'').trim(),category:(p.querySelector('category')?.textContent||'').trim()};
    if(!buckets.has(ch)) buckets.set(ch,[]);
    buckets.get(ch).push(entry);
  }
  const map=new Map();
  for(const [ch,list] of buckets){
    list.sort((a,b)=>a.start-b.start);
    const current=list.find(x=>x.start<=now && x.stop>now) || null;
    const next=list.find(x=>x.start>now) || null;
    map.set(ch,{current,next});
  }
  state.epg=map; state.epgEntries=buckets;
}
async function loadEpg(url){
  if(!url) return;
  try{ const xml=await getText(url); parseEpg(xml); state.epgSource=url; }
  catch(e){ toast('EPG não pôde ser carregado'); }
}
function epgFor(c){
  const id=(c.tvgId||c.name||'').trim();
  const list=state.epgEntries.get(id)||state.epgEntries.get(c.name);
  if(list){ const now=Date.now();return {current:list.find(x=>+x.start<=now&&+x.stop>now)||null,next:list.find(x=>+x.start>now)||null}; }
  return state.epg.get(id) || state.epg.get(c.name) || null;
}

  all[key]={kind:c.kind||old.kind||'movie',name:c.name||old.name||'Conteúdo',logo:c.logo||old.logo||'',url:c.url,

function play(list,i,vod){
  if(!vod && list[i])markLiveRecent(list[i]);
  if(NATIVE){
    if(list[i]) markRecent(list[i]);
    const a=Math.max(0,i-250);
    const j=JSON.stringify(list.slice(a,i+250).map(c=>[c.name,c.url,currentProgramText(c),c.kind||'',c.logo||'',c.seriesName||'',String(c.seriesId||''),String(c.season||''),String(c.episode||'')]));
    if(vod&&list[i]?.kind==='ep'&&Android.playEpisodes) Android.playEpisodes(j,i-a); else if(vod&&Android.playVod) Android.playVod(j,i-a); else Android.play(j,i-a);
    return;
  }
  state.queue=list; state.qi=Math.max(0,i); state.vod=!!vod; state.drawer=false;
  startPlayback();
}

// Posição salva somente no dispositivo; nunca envia histórico ao servidor.
const PROGRESS_KEY='nico_playback_progress_v1';
function getProgressMap(){try {const o=JSON.parse(store.get(PROGRESS_KEY)||'{}');return o&&typeof o==='object'?o:{};}catch(e){return {};}}
function progressId(c){return c&&c.url?'media:'+c.url:null;}
function savePlaybackProgress(force=false){
 const v=$('#video'),c=state.queue[state.qi];if(!state.vod||!v||!c)return;
 const duration=v.duration,position=v.currentTime;
 if(!Number.isFinite(duration)||duration<=0||!Number.isFinite(position))return;
 if(!force&&Date.now()-(savePlaybackProgress.last||0)<5000)return;
 savePlaybackProgress.last=Date.now();
 const key=progressId(c),all=getProgressMap();if(!key)return;
 if(position>=duration-8 || v.ended)delete all[key];
 else if(position>=3)all[key]={position:Math.floor(position),duration:Math.floor(duration),when:Date.now()};
 const keys=Object.keys(all);if(keys.length>150)keys.sort((a,b)=>(all[a].when||0)-(all[b].when||0)).slice(0,keys.length-150).forEach(k=>delete all[k]);
 store.set(PROGRESS_KEY,JSON.stringify(all));
 saveHistory(c,position,duration,position>=duration-8||v.ended);
}
function clearPlaybackProgress(c){const key=progressId(c);if(!key)return;const all=getProgressMap();delete all[key];store.set(PROGRESS_KEY,JSON.stringify(all));}
function clock(sec){if(!Number.isFinite(sec)||sec<0)return '--:--';sec=Math.floor(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?`${h}:${String(m).padStart(2,'0')}`:String(m).padStart(2,'0'))+':'+String(s).padStart(2,'0');}
function updatePlaybackTimeline(){
 const v=$('#video'),box=$('#playbackTimeline');
 const eligible=state.vod&&Number.isFinite(v.duration)&&v.duration>0;
 box.hidden=!eligible;if(!eligible)return;
 const canSeek=v.seekable&&v.seekable.length>0;
 const input=$('#playbackSeek');input.disabled=!canSeek;
 if(!input.matches(':active')&&!input.dataset.dragging)input.value=String(Math.round((v.currentTime/v.duration)*1000)||0);
 $('#playbackElapsed').textContent=clock(v.currentTime);
 $('#playbackRemaining').textContent='Restante: '+clock(Math.max(0,v.duration-v.currentTime));
 $('#playbackDuration').textContent=clock(v.duration);
}
function restorePlaybackProgress(c,v){
 const data=getProgressMap()[progressId(c)];
 if(!data||!state.vod||!Number.isFinite(v.duration)||v.duration<=0||!v.seekable?.length)return;
 const position=Number(data.position);
 if(position>5&&position<v.duration-12){v.currentTime=Math.min(position,v.duration-10);toast('Continuando de '+clock(position));}
}

let nextEpisodeTimer=null;

function canNextEpisode(){return state.episodes&&state.qi<state.queue.length-1;}
function goNextEpisode(){

}
function offerNextEpisode(){

function updatePlaybackControls(){

// A interface nunca deve depender de hover/foco ou pointermove artificial do emulador.
const PLAYER_IDLE_MS=3000;
let lastRealPlayerInteraction=0;
let playerIdleWatchdog=null;
function playerMenuActive(){
 const drawer=$('#drawer'),tracks=$('#trackPanel'),next=$('#nextEpisodeCard');
 return drawer.classList.contains('on') || !tracks.hidden || !next.hidden ||
        $('#playbackSeek').dataset.dragging==='1';
}
function showPlayerBar(){
 const player=$('#player');
 if(!player.classList.contains('on'))return;
 lastRealPlayerInteraction=Date.now();
 player.classList.remove('controls-hidden');
 $('#playerBar').classList.remove('hide');
 // Um relógio fixo evita loops de timeout disparados por eventos sintéticos.
 if(!playerIdleWatchdog) playerIdleWatchdog=setInterval(hideIdlePlayerControls,250);
}
function hideIdlePlayerControls(){
 const player=$('#player');
 if(!player.classList.contains('on')){
   clearInterval(playerIdleWatchdog);playerIdleWatchdog=null;return;
 }
 if(Date.now()-lastRealPlayerInteraction<PLAYER_IDLE_MS)return;
 if(playerMenuActive())return;
 player.classList.add('controls-hidden');
 $('#playerBar').classList.add('hide');
}
function startPlayback(){
  if(!state.vod && state.queue[state.qi])markLiveRecent(state.queue[state.qi]);
  const c=state.queue[state.qi];if(!c)return;
  markRecent(c);updatePlayerFav();
  const player=$('#player'),v=$('#video'), msg=$('#playerMsg');
  clearNextEpisode();lastPointerPosition=null;player.classList.add('on');state.drawer=false;$('#drawer').classList.remove('on');closeTrackPanel();
  $('#playerTitle').textContent=c.name;
  $('#playerSub').textContent=playerSubtitle(c,state.vod);
  msg.style.display='grid';msg.textContent='Carregando transmissão…';
  v.pause();v.removeAttribute('src');v.load();
  if(state.hls){state.hls.destroy();state.hls=null;}
  $('#playbackTimeline').hidden=true;
  const fail=()=>{msg.style.display='grid';msg.textContent='Não foi possível reproduzir.\nTente novamente ou selecione outro canal.';showPlayerBar();};
  v.onplaying=()=>{msg.style.display='none';showPlayerBar();updatePlaybackControls();};
  v.onended=()=>{saveHistory(c,v.duration,v.duration,true);clearPlaybackProgress(c);updatePlaybackControls();offerNextEpisode();};
  v.onloadedmetadata=()=>{restorePlaybackProgress(c,v);updatePlaybackTimeline();};
  v.ontimeupdate=()=>{updatePlaybackTimeline();savePlaybackProgress();};
  v.onerror=fail;
  if(window.Hls&&Hls.isSupported()&&/\.m3u8(\?|$)/i.test(c.url)){
    const h=new Hls();state.hls=h;h.loadSource(c.url);h.attachMedia(v);
    h.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)fail();});
  }else v.src=c.url;
  v.play().catch(()=>{msg.style.display='grid';msg.textContent='Pressione reproduzir ou tente novamente.';});
  showPlayerBar();renderDrawer();updatePlaybackControls();
}
async function setFullscreen(force){
  const el=$('#player'),active=!!document.fullscreenElement||!!document.webkitFullscreenElement;
  try{
    if(force===false||active){
      if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
    }else{
      if(el.requestFullscreen)await el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();else toast('Use F11 para tela cheia neste navegador');
    }
  }catch(e){toast('Tela cheia não disponível; experimente F11');}
  syncFullscreenButton();
}
function syncFullscreenButton(){
  const active=!!document.fullscreenElement||!!document.webkitFullscreenElement;
  $('#fullscreenBtn').textContent=active?'⛶ Sair da tela cheia':'⛶ Tela cheia';
  $('#fullscreenBtn').setAttribute('aria-pressed',String(active));
}
function stopPlayback(){
  savePlaybackProgress(true);clearNextEpisode(); const v=$('#video');if(state.hls){state.hls.destroy();state.hls=null;}
  v.pause();v.removeAttribute('src');v.load();$('#playbackTimeline').hidden=true;
  if(document.fullscreenElement===$('#player'))document.exitFullscreen?.().catch(()=>{});
  $('#player').classList.remove('on');clearInterval(playerIdleWatchdog);playerIdleWatchdog=null;$('#drawer').classList.remove('on');state.drawer=false;closeTrackPanel();
  render();focusFirst();
}
function renderDrawer(){
  const list=$('#drawerList');list.textContent='';
  // Virtual window: avoid adding thousands of channel buttons on TV hardware.
  const start=Math.max(0,state.qi-35),end=Math.min(state.queue.length,state.qi+36);
  if(start){const note=document.createElement('div');note.className='track-note';note.textContent=`${start} canais anteriores · use ↑ para voltar`;list.append(note);}
  for(let idx=start;idx<end;idx++){
    const c=state.queue[idx],item=document.createElement('button');
    item.className='drawer-item'+(idx===state.qi?' active':'');
    const title=document.createElement('div');title.textContent=`${idx+1}. ${c.name}`;
    const sub=document.createElement('div');sub.className='small';const ep=epgFor(c);sub.textContent=ep?.current?(timeFmt(ep.current.start)+'–'+timeFmt(ep.current.stop)+' · '+ep.current.title):c.group||'Programação indisponível';
    item.append(title,sub);
    item.onclick=()=>{savePlaybackProgress(true);state.qi=idx;startPlayback();};list.append(item);
  }
  if(end<state.queue.length){const note=document.createElement('div');note.className='track-note';note.textContent=`Mais ${state.queue.length-end} canais · use ↓ para avançar`;list.append(note);}
  const current=list.querySelector('.drawer-item.active');if(state.drawer && current)current.scrollIntoView({block:'nearest'});
}
function toggleDrawer(force){
  state.drawer=typeof force==='boolean'?force:!state.drawer;
  closeTrackPanel();$('#drawer').classList.toggle('on',state.drawer);
  if(state.drawer)renderDrawer();showPlayerBar();
}
/* Navigation and events */
$('#homeBtn').onclick=()=>{ state.view=null; state.detail=null; state.favoriteOnly=false; state.recentOnly=false; render(); scrollTo(0,0); };
$('#importBtn').onclick=()=>openImport();
$('#homeNav').onclick=()=>$('#homeBtn').click();
$('#liveNav').onclick=()=>setMode('live');
$('#movieNav').onclick=()=>setMode('movies');
$('#seriesNav').onclick=()=>setMode('series');
$('#searchNav').onclick=()=>$('#search').focus();
$('#importNav').onclick=()=>openImport(); $('#importNav2').onclick=()=>openImport();
$('#favNav').onclick=()=>{ state.favoriteOnly=!state.favoriteOnly; state.recentOnly=false; state.view=null; $('#favNav').setAttribute('aria-pressed',state.favoriteOnly); $('#recentNav').setAttribute('aria-pressed','false'); render(); };
$('#recentNav').onclick=()=>{ state.recentOnly=!state.recentOnly; state.favoriteOnly=false; state.view=null; $('#recentNav').setAttribute('aria-pressed',state.recentOnly); $('#favNav').setAttribute('aria-pressed','false'); render(); };
$('#search').oninput=e=>{ state.query=e.target.value.trim(); state.view=null; render(); };
$('#backBtn').onclick=stopPlayback;
$('#prevBtn').onclick=()=>{if(state.queue.length){savePlaybackProgress(true);state.qi=(state.qi-1+state.queue.length)%state.queue.length;startPlayback();}};
$('#nextBtn').onclick=()=>{if(state.queue.length){savePlaybackProgress(true);state.qi=(state.qi+1)%state.queue.length;startPlayback();}};
$('#drawerBtn').onclick=()=>toggleDrawer();$('#closeDrawerBtn').onclick=()=>toggleDrawer(false);
$('#retryBtn').onclick=()=>startPlayback();
$('#exitPlayerBtn').onclick=stopPlayback;
$('#playPauseBtn').onclick=()=>{const v=$('#video'); if(v.paused)v.play().catch(()=>toast('Não foi possível iniciar a reprodução'));else v.pause();updatePlaybackControls();showPlayerBar();};
function seekRelative(delta){const v=$('#video');if(!state.vod||!Number.isFinite(v.duration)||v.seekable.length===0)return;v.currentTime=Math.min(Math.max(0,v.currentTime+delta),v.duration);showPlayerBar();}
$('#rewind10Btn').onclick=()=>seekRelative(-10);
$('#forward10Btn').onclick=()=>seekRelative(10);
$('#fullscreenBottomBtn').onclick=()=>setFullscreen();
$('#nextEpisodeBtn').onclick=goNextEpisode;
$('#watchNextEpisode').onclick=goNextEpisode;
$('#cancelNextEpisode').onclick=clearNextEpisode;
$('#video').addEventListener('pause',()=>{savePlaybackProgress(true);updatePlaybackControls();updatePlaybackTimeline();showPlayerBar();});
$('#playbackSeek').addEventListener('input',e=>{const v=$('#video');if(state.vod&&Number.isFinite(v.duration)&&v.duration>0&&v.seekable?.length){v.currentTime=v.duration*Number(e.target.value)/1000;updatePlaybackTimeline();showPlayerBar();}});
$('#playbackSeek').addEventListener('change',()=>savePlaybackProgress(true));
$('#video').addEventListener('play',updatePlaybackControls);
$('#video').addEventListener('durationchange',updatePlaybackControls);
$('#video').addEventListener('loadedmetadata',updatePlaybackControls);
$('#playerFavBtn').onclick=()=>{ const c=state.queue[state.qi];if(c)toggleFav(c); };
$('#fullscreenBtn').onclick=()=>setFullscreen();
$('#guidePlayerBtn').onclick=openGuide;
$('#guideClose').onclick=()=>$('#guideDialog').close();
$('#infoClose').onclick=()=>$('#infoDialog').close();
$('#infoWatch').onclick=()=>{const fn=infoPlayAction;$('#infoDialog').close(); if(fn)fn();};
$('#audioBtn').onclick=()=>showTracks('audio');
$('#subtitleBtn').onclick=()=>showTracks('subtitle');
$('#closeTracksBtn').onclick=closeTrackPanel;
// Ignora o movimento residual/sintético do BlueStacks, inclusive oscilação de poucos pixels.
let lastPointerPosition=null;
$('#player').addEventListener('pointermove',e=>{
 if(e.pointerType && e.pointerType!=='mouse')return;
 const current={x:e.clientX,y:e.clientY};
 if(!lastPointerPosition){lastPointerPosition=current;return;}
 const distance=Math.hypot(current.x-lastPointerPosition.x,current.y-lastPointerPosition.y);
 if(distance<24)return;
 lastPointerPosition=current;
 showPlayerBar();
});
$('#player').addEventListener('pointerdown',()=>{delete $('#player').dataset.keyboardNav;showPlayerBar();});
$('#playbackSeek').addEventListener('pointerdown',()=>{$('#playbackSeek').dataset.dragging='1';showPlayerBar();});
window.addEventListener('pointerup',()=>{if($('#playbackSeek').dataset.dragging){delete $('#playbackSeek').dataset.dragging;showPlayerBar();}});
document.addEventListener('fullscreenchange',syncFullscreenButton);
document.addEventListener('webkitfullscreenchange',syncFullscreenButton);


/* Teclado virtual: foco no campo de texto precisa acionar IME no Android/Fire OS. */
const importFields=['m3uUrl','m3uText','epgUrl','xtServer','xtUser','xtPass'];
importFields.forEach(id=>{
  const el=document.getElementById(id);
  if(!el)return;
  el.addEventListener('focus',()=>{
    if(window.Android && typeof window.Android.showKeyboard==='function'){
      // Espera o WebView atualizar seu editor de texto antes de solicitar o IME.
      setTimeout(()=>{if(document.activeElement===el)window.Android.showKeyboard();},120);
    }
    setTimeout(()=>{if(document.activeElement===el)el.scrollIntoView({block:'nearest'});},180);
  });
});
$('#toggleXtPass').onclick=()=>{
  const el=$('#xtPass'),shown=el.type==='password';
  el.type=shown?'text':'password';
  $('#toggleXtPass').textContent=shown?'Ocultar':'Mostrar';
  $('#toggleXtPass').setAttribute('aria-pressed',String(shown));
  $('#toggleXtPass').setAttribute('aria-label',shown?'Ocultar senha':'Mostrar senha');
};
// Chamado pelo botão Voltar nativo: fecha painel/modal antes de sair do aplicativo.
window.__back=()=>{
  if($('#dlg').open){
    const a=document.activeElement;
    if(a && /^(INPUT|TEXTAREA)$/.test(a.tagName)){
      a.blur();
      if(window.Android && typeof window.Android.hideKeyboard==='function')window.Android.hideKeyboard();
      return true;
    }
    $('#dlg').close(); return true;
  }
  if($('#guideDialog').open){$('#guideDialog').close();return true;}
  if($('#infoDialog').open){$('#infoDialog').close();return true;}
  if($('#player').classList.contains('on')){stopPlayback();return true;}
  if(state.detail){state.detail=null;render();return true;}
  if(state.view){state.view=null;render();return true;}
  return false;
};

function openImport(){ $('#err').textContent=''; $('#dlg').showModal(); }
$('#cancelImport').onclick=()=>$('#dlg').close();
$$('.tabs .btn').forEach(b=>b.onclick=()=>{ state.tab=b.dataset.t; $$('.tabs .btn').forEach(x=>x.setAttribute('aria-pressed',x===b)); $('#pane-m3u').classList.toggle('on',state.tab==='m3u'); $('#pane-xt').classList.toggle('on',state.tab==='xt'); });
$('#confirmImport').onclick=async()=>{
  const err=$('#err'); err.textContent='Carregando…';
  try{
    let src;
    if(state.tab==='xt'){
      const server=$('#xtServer').value.trim(), user=$('#xtUser').value.trim(), pass=$('#xtPass').value;
      if(!server||!user||!pass) throw new Error('miss');
      src={type:'xt',server,user,pass};
    } else {
      const file=$('#m3uFile').files[0], text=$('#m3uText').value.trim(), url=$('#m3uUrl').value.trim(), epgUrl=$('#epgUrl').value.trim();
      if(file) src={type:'m3u',text:await file.text(),epgUrl}; else if(text) src={type:'m3u',text,epgUrl}; else if(url) src={type:'m3u',url,epgUrl}; else throw new Error('miss');
    }
    await importFrom(src); $('#dlg').close();
  } catch(e){
    err.textContent=e.message==='miss'?'Preencha os campos da aba escolhida.' : e.message==='empty'?'Nenhum item encontrado. Verifique se a lista está correta.' : e.message==='auth'?'Usuário ou senha não aceitos pelo servidor.' : readableConnectionError(e);
  }
};

/* Mouse/teclado no PC: setas verticais rolam. Controle D-pad permanece espacial. */
let desktopPointerMode=false;
document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')desktopPointerMode=true;});
/* Keyboard / remote */
document.addEventListener('keydown',e=>{
  const k=e.key; const playing=$('#player').classList.contains('on');
  if(['Escape','GoBack','BrowserBack','Backspace'].includes(k)||e.keyCode===4){
    if(NATIVE) return;
    if($('#dlg').open){ e.preventDefault(); $('#dlg').close(); return; }
    if(playing){ e.preventDefault(); if(!$('#trackPanel').hidden)closeTrackPanel(); else if(state.drawer)toggleDrawer(false); else stopPlayback(); return; }
    if(state.detail){ e.preventDefault(); state.detail=null; render(); return; }
    if(state.view){ e.preventDefault(); state.view=null; render(); return; }
  }
  if(playing){
    showPlayerBar();
    if(k==='ArrowUp'){ e.preventDefault(); if(!$('#trackPanel').hidden)return; if(state.queue.length){state.qi=(state.qi-1+state.queue.length)%state.queue.length; if(state.drawer)renderDrawer(); else startPlayback();} }
    else if(k==='ArrowDown'){ e.preventDefault(); if(!$('#trackPanel').hidden)return; if(state.queue.length){state.qi=(state.qi+1)%state.queue.length; if(state.drawer)renderDrawer(); else startPlayback();} }
    else if(k==='ArrowRight' && !state.drawer){ e.preventDefault(); toggleDrawer(true); }
    else if(k==='ArrowLeft' && state.drawer){ e.preventDefault(); toggleDrawer(false); }
    else if((k==='Enter'||k===' ') && state.drawer){ e.preventDefault();startPlayback(); }
    else if(k==='f'||k==='F'){e.preventDefault();setFullscreen();}
    else if(k==='a'||k==='A'){e.preventDefault();showTracks('audio');}
    else if(k==='s'||k==='S'){e.preventDefault();showTracks('subtitle');}
    return;
  }
  if($('#dlg').open||$('#guideDialog').open||$('#infoDialog').open) return;
  const el=document.activeElement;
  if(desktopPointerMode && (k==='ArrowDown'||k==='ArrowUp') && !(el && /INPUT|TEXTAREA/.test(el.tagName))){
    e.preventDefault(); window.scrollBy({top:(k==='ArrowDown'?1:-1)*Math.max(160,window.innerHeight*.4),behavior:'smooth'}); return;
  }

  if(el && /INPUT|TEXTAREA/.test(el.tagName) && !k.startsWith('Arrow')) return;
  if(!k.startsWith('Arrow')) return;
  const nodes=[...document.querySelectorAll('.sidebar .navbtn,.topbar .btn,#search,#app button,#app .card,#app .ep-item')].filter(o=>o.offsetParent!==null);
  if(!nodes.length) return;
  if(!nodes.includes(el)){ nodes[0].focus(); e.preventDefault(); return; }
  const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2; let best=null, bestScore=1e9;
  for(const o of nodes){ if(o===el) continue; const q=o.getBoundingClientRect(), ox=q.left+q.width/2, oy=q.top+q.height/2, dx=ox-cx, dy=oy-cy; let ok=false, score=1e9; if(k==='ArrowRight'){ ok=dx>4; score=dx+Math.abs(dy)*2.2; } else if(k==='ArrowLeft'){ ok=dx<-4; score=-dx+Math.abs(dy)*2.2; } else if(k==='ArrowDown'){ ok=dy>8; score=dy+Math.abs(dx)*1.5; } else if(k==='ArrowUp'){ ok=dy<-8; score=-dy+Math.abs(dx)*1.5; } if(ok && score<bestScore){ best=o; bestScore=score; } }
  if(best){ e.preventDefault(); best.focus({preventScroll:true}); best.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'}); }
});

function focusFirst(){ if(document.activeElement===$('#search')||desktopPointerMode)return; const el=document.querySelector('#app .btn,#app .card,.sidebar .navbtn'); if(el) el.focus({preventScroll:true}); }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }
function escapeAttr(s){ return String(s??'').replace(/[^\w\-]+/g,'_'); }

(async()=>{
  try{ const saved=JSON.parse(store.get('nico_source')||'null'); if(saved) await importFrom(saved); else render(); }catch(e){ render(); }
})();
</script>
