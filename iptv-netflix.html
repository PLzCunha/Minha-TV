<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha TV • Fire TV Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1118;--panel:#181c27;--line:#2a3042;--text:#f1f3f9;--mute:#8d95b1;--accent:#52dcf0;--gold:#f4c46c;--good:#46d2a0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.4 Manrope,system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus{outline:none}
:focus-visible,.card:focus{outline:3px solid #fff;outline-offset:2px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:12px 4vw;background:linear-gradient(110deg,#0c101b,#101928f5)}
.brand{font-weight:800;font-size:22px;color:var(--accent);margin-right:auto}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 16px;font-weight:600}
.btn.main{background:var(--accent);border-color:var(--accent);color:#061322}
.btn:focus{outline:3px solid #fff}
#hero{margin:8px 4vw 8px;padding:6vw 5vw;border-radius:14px;background:linear-gradient(100deg,#2a1d3b,#14233a);display:flex;gap:24px;align-items:center;min-height:200px}
#hero img{width:min(22vw,160px);height:min(22vw,160px);object-fit:contain;background:#ffffff14;border-radius:14px;padding:10px}
#hero h2{margin:0 0 4px;font-size:clamp(22px,4vw,42px)}
#hero p{margin:0 0 14px;color:var(--mute)}
section.row{margin:18px 0}
.row h3{margin:0 4vw 8px;font-size:19px}
.row h3 button{font:inherit;font-weight:800}
.row h3 button:focus{outline:3px solid #fff;outline-offset:3px}
.strip{display:flex;gap:12px;overflow-x:auto;padding:6px 4vw 10px;scroll-padding:0 4vw;scrollbar-width:none}
.card{flex:none;width:clamp(120px,15vw,200px);background:var(--panel);border-radius:10px;padding:10px;text-align:center;transition:transform .12s}
.card:focus{transform:scale(1.07)}
.card img{width:100%;aspect-ratio:16/10;object-fit:contain;background:#ffffff0f;border-radius:6px}
.card span{display:block;margin-top:8px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.poster{width:clamp(110px,12vw,160px)}.card.poster img{aspect-ratio:2/3;object-fit:cover}.btn[aria-pressed=true]{background:#2d3350}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(120px,15vw,200px),1fr));gap:12px;padding:6px 4vw}
.grid .card{width:auto}
.empty{padding:12vh 6vw;text-align:center;color:var(--mute)}
.empty h2{color:var(--text)}
#player{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:#000;display:none}
#player.on{display:block}
#player video{width:100%;height:100%}
#bar{position:absolute;left:0;right:0;top:0;padding:14px 4vw;background:linear-gradient(#000c,#0000);display:flex;gap:12px;align-items:center;transition:opacity .3s}
#bar.hide{opacity:0}
#pt{flex:1;font-weight:800;font-size:20px}
#pmsg{position:absolute;top:0;left:0;right:0;bottom:0;display:grid;place-items:center;text-align:center;padding:20px;pointer-events:none;color:#cfd3e6}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;width:min(560px,94vw);padding:20px}
dialog::backdrop{background:#000a}
dialog h2{margin:0 0 10px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs .btn[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}
label{display:block;margin:10px 0 4px;font-weight:600}
input[type=text],input[type=url],input[type=password],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
input:focus,textarea:focus{outline:3px solid #fff}
textarea{height:90px}
.pane{display:none}.pane.on{display:block}
.row2{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#err{color:var(--accent);min-height:1.3em;margin-top:8px}
.hint{color:var(--mute);font-size:13px;margin:4px 0 0}

/* TV edition: foco, legibilidade, busca e atalhos */
html{scroll-behavior:smooth}body{background:radial-gradient(ellipse 90% 60% at 80% -20%,#174158 0%,transparent 65%),#0b1019;min-height:100vh}
header{gap:10px;flex-wrap:wrap;border-bottom:1px solid #243245;box-shadow:0 8px 30px #0005} .brand{letter-spacing:.06em;white-space:nowrap}
.btn{min-height:46px;border-radius:12px;transition:background .16s,transform .16s} .btn:hover{background:#303c55}
.btn.main:hover{background:#7ae7f5} .btn:focus-visible,.card:focus,.row h3 button:focus-visible,input:focus-visible{outline:3px solid #f7d27b;outline-offset:3px;box-shadow:0 0 0 7px #f4c46c22}
#hero{position:relative;overflow:hidden;border:1px solid #294459;box-shadow:0 18px 65px #0007;background:linear-gradient(105deg,#113449,#182b45 60%,#112034);min-height:260px}
#hero:before{content:"";position:absolute;right:-60px;top:-100px;height:320px;width:320px;border-radius:50%;background:#52dcf01b;filter:blur(45px);pointer-events:none}
#hero img{width:min(24vw,210px);height:min(24vw,210px);z-index:1}#hero>div{z-index:1}#hero h2{font-weight:800;letter-spacing:-.04em}
.row h3{color:#eaf5fb;font-size:21px;letter-spacing:-.02em;margin-bottom:10px}.row h3 button{color:inherit}
.card{background:linear-gradient(145deg,#1c2839,#131d2c);border:1px solid #2d4052;min-height:148px;position:relative}.card:hover,.card:focus{transform:scale(1.06);border-color:#f4c46c;z-index:3;box-shadow:0 8px 24px #000b}
.card img{background:#ffffff0b}.card span{font-weight:600}.favstar{position:absolute;top:7px;right:7px;background:#061322db;border:1px solid #466276;color:var(--gold);font-size:19px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;z-index:2}
.favstar:focus-visible{outline:3px solid var(--gold)}.toolrow{display:flex;align-items:center;gap:14px;padding:16px 4vw 4px;flex-wrap:wrap}.toolrow input{max-width:560px;min-width:230px;flex:1;background:#111b2a;border:1px solid #304358;min-height:48px;border-radius:12px;padding:0 14px}.searchlabel{margin:0;color:#b7d0de}.toolrow #counter{font-size:13px;color:#93a8b6}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#163749;color:#fff;border:1px solid #448399;padding:12px 24px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100}#toast.show{opacity:1}
#webcontrols{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:9px;opacity:.8}#webcontrols .btn{background:#17243cdb}
#pmsg{font-size:22px;text-shadow:0 2px 8px #000;white-space:pre-line}
@media(max-width:650px){header{padding:9px 3vw}.brand{width:100%;font-size:18px}.btn{padding:8px 10px;font-size:13px;min-height:42px}#hero{margin:12px 3vw;min-height:180px;padding:25px 15px}#hero img{width:110px;height:110px}#hero h2{font-size:22px}.toolrow{padding:12px 3vw 4px}.strip{padding-left:3vw}.row h3{margin-left:3vw}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <span class="brand">◈ MINHA TV <small style="font-size:10px;color:#93a5ba;font-weight:600">FIRE EDITION</small></span>
  <button class="btn" id="tl" hidden>Ao vivo</button><button class="btn" id="tm" hidden>Filmes</button><button class="btn" id="ts" hidden>Séries</button>
  <button class="btn" id="home">Início</button><button class="btn" id="favbtn">★ Favoritos</button><button class="btn" id="recentbtn">↺ Recentes</button>
  <button class="btn main" id="imp">Importar</button>
</header>
<div class="toolrow"><label class="searchlabel" for="search">⌕ Buscar</label><input id="search" type="text" placeholder="Buscar canais, filmes ou séries" autocomplete="off"><span id="counter" aria-live="polite"></span></div><div id="app"></div><div id="toast" role="status" aria-live="polite"></div>

<div id="player">
  <video id="v" autoplay playsinline controls></video>
  <div id="bar"><button class="btn" id="back">Voltar</button><div id="pt"></div></div>
  <div id="pmsg"></div><div id="webcontrols"><button class="btn" id="prevchan">↑ Anterior</button><button class="btn" id="nextchan">↓ Próximo</button><button class="btn" id="webfav">☆ Favorito</button></div>
</div>

<dialog id="dlg">
  <h2>Importar lista</h2>
  <div class="tabs">
    <button class="btn" data-t="m3u" aria-pressed="true">M3U</button>
    <button class="btn" data-t="xt" aria-pressed="false">Xtream</button>
  </div>
  <div class="pane on" id="p-m3u">
    <label for="u">Link da lista M3U</label>
    <input type="url" id="u" placeholder="http://servidor/lista.m3u">
    <label for="f">Ou arquivo .m3u</label>
    <input type="file" id="f" accept=".m3u,.m3u8,.txt">
    <label for="t">Ou cole o conteúdo</label>
    <textarea id="t" placeholder="#EXTM3U"></textarea>
  </div>
  <div class="pane" id="p-xt">
    <label for="xs">Servidor</label>
    <input type="text" id="xs" placeholder="http://servidor:porta">
    <label for="xu">Usuário</label>
    <input type="text" id="xu" autocomplete="off">
    <label for="xp">Senha</label>
    <input type="password" id="xp" autocomplete="off">
  </div>
  <p class="hint">Use apenas listas de provedores que você assina ou conteúdo que tem direito de assistir.</p>
  <div id="err" role="alert"></div>
  <div class="row2"><button class="btn" id="cx">Cancelar</button><button class="btn main" id="go">Importar</button></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let favoriteOnly=false,recentOnly=false,query='';
let channels=[],view=null,hls=null,queue=[],qi=0,tab='m3u',movies=null,series=null,xt=null,mode='live',detail=null,loading=false;

/* Preferências armazenadas no aparelho, sem serviço externo */
function loadArray(k){try{const a=JSON.parse(store.get(k)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
let favorites=loadArray('tv_favorites'),recent=loadArray('tv_recent');
function keyOf(c){return c.url||('series:'+c.id)||c.name}
function isFav(c){return favorites.includes(keyOf(c))}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2500)}
function markRecent(c){const k=keyOf(c);recent=[k,...recent.filter(x=>x!==k)].slice(0,40);store.set('tv_recent',JSON.stringify(recent))}
function toggleFav(c){const k=keyOf(c);favorites=isFav(c)?favorites.filter(x=>x!==k):[...favorites,k];store.set('tv_favorites',JSON.stringify(favorites));toast(isFav(c)?'Adicionado aos favoritos':'Removido dos favoritos');render()}
function selectList(all){if(favoriteOnly)return all.filter(isFav);if(recentOnly)return recent.map(k=>all.find(c=>keyOf(c)===k)).filter(Boolean);return all}
/* ---------- Ponte com o app Android (se existir) ---------- */
const NATIVE=!!window.Android;
function nativeGet(u){return new Promise((ok,no)=>{const id='c'+Date.now()+Math.floor(Math.random()*1e4);window[id]=(good,d)=>{delete window[id];good?ok(d):no(new Error('http'))};Android.get(u,id)})}
async function getText(u){if(NATIVE)return nativeGet(u);const r=await fetch(u);if(!r.ok)throw new Error('http');return r.text()}
function goBack(){if($('#dlg').open){$('#dlg').close();return true}if(detail){detail=null;render();return true}if(view){view=null;render();return true}return false}
window.__back=goBack;

/* ---------- Importação ---------- */
function parseM3U(text){
  const out=[];let info=null;
  for(const raw of text.split(/\r?\n/)){
    const l=raw.trim();
    if(l.startsWith('#EXTINF')){
      const a=k=>{const m=l.match(new RegExp(k+'="([^"]*)"'));return m?m[1]:''};
      info={name:l.slice(l.lastIndexOf(',')+1).trim()||a('tvg-name')||'Sem nome',logo:a('tvg-logo'),group:a('group-title')||'Outros'};
    }else if(l&&!l.startsWith('#')&&info){out.push({...info,url:l});info=null}
  }
  return out;
}
async function getJSON(u){return JSON.parse(await getText(u))}
async function loadXtream(server,user,pass){
  let base=server.trim().replace(/\/+$/,'');if(!/^https?:\/\//i.test(base))base='http://'+base;
  const api=`${base}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`;
  xt={base,user,pass,api};
  const [cats,streams]=await Promise.all([getJSON(api+'&action=get_live_categories'),getJSON(api+'&action=get_live_streams')]);
  const names={};(cats||[]).forEach(c=>names[c.category_id]=c.category_name);
  if(!Array.isArray(streams))throw new Error('auth');
  return streams.map(s=>({name:s.name||'Sem nome',logo:s.stream_icon||'',group:names[s.category_id]||'Outros',
    url:`${base}/live/${encodeURIComponent(user)}/${encodeURIComponent(pass)}/${s.stream_id}.m3u8`}));
}
async function importFrom(src){
  let list;xt=null;
  if(src.type==='xt')list=await loadXtream(src.server,src.user,src.pass);
  else{
    let text=src.text;
    if(!text)text=await getText(src.url);
    list=parseM3U(text);
    if(src.text&&src.text.length<3e6)src.keep=true;
  }
  if(!list.length)throw new Error('empty');
  channels=list;favoriteOnly=false;recentOnly=false;query='';$('#search').value='';view=null;movies=null;series=null;detail=null;mode='live';
  store.set('src',JSON.stringify(src.type==='xt'||src.url?src:{type:'m3u',text:src.text}));
  render();
}

/* ---------- Interface ---------- */
function byGroup(l){
  const m=new Map();l.forEach(c=>{if(!m.has(c.group))m.set(c.group,[]);m.get(c.group).push(c)});return m;
}
const enc=encodeURIComponent;
function updateTabs(){
  [['tl','live'],['tm','movies'],['ts','series']].forEach(([id,m])=>{const b=$('#'+id);b.hidden=!xt;b.setAttribute('aria-pressed',mode===m)});
}
function cur(){return mode==='movies'?movies:mode==='series'?series:channels}
function card(c,list){
  const b=document.createElement('div');b.tabIndex=0;b.setAttribute('role','button');b.className='card'+(c.kind==='movie'||c.kind==='series'?' poster':'');b.setAttribute('aria-label',c.name);
  const i=document.createElement('img');i.loading='lazy';i.alt='';if(c.logo)i.src=c.logo;i.onerror=()=>i.removeAttribute('src');
  const s=document.createElement('span');s.textContent=c.name;
  b.append(i,s);b.onclick=()=>openItem(c,list);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openItem(c,list)}};
  const star=document.createElement('button');star.className='favstar';star.textContent=isFav(c)?'★':'☆';star.setAttribute('aria-label',(isFav(c)?'Remover favorito: ':'Favoritar: ')+c.name);
  star.onclick=e=>{e.preventDefault();e.stopPropagation();toggleFav(c)};b.append(star);return b;
}
function openItem(c,list){
  markRecent(c);
  if(c.kind==='series')openSeries(c);
  else if(c.kind==='movie')play([c],0,true);
  else if(c.kind==='ep')play(list,list.indexOf(c),true);
  else play(list,list.indexOf(c));
}
function emptyMsg(app,t,p){app.innerHTML='<div class="empty"><h2></h2><p></p></div>';app.querySelector('h2').textContent=t;app.querySelector('p').textContent=p}
function render(){
  updateTabs();
  const app=$('#app');app.innerHTML='';
  if(loading){emptyMsg(app,'Carregando…','Listas grandes podem levar alguns segundos.');return}
  if(detail){renderDetail(app);return}
  let all=selectList(cur()||[]);if(query){const q=query.toLocaleLowerCase('pt-BR');all=all.filter(c=>(c.name+' '+c.group).toLocaleLowerCase('pt-BR').includes(q))}$('#counter').textContent=all.length+' itens';
  if(!all.length){
    if(mode==='live'&&!channels.length)emptyMsg(app,'Nenhuma lista carregada','Toque em Importar e informe sua lista M3U ou os dados Xtream.');
    else emptyMsg(app,'Nenhum resultado','Altere a busca, os filtros ou escolha outra categoria.');
    return;
  }
  const groups=byGroup(all);
  if(view){
    const list=groups.get(view)||[];
    const h=document.createElement('section');h.className='row';h.innerHTML='<h3></h3>';h.firstChild.textContent=view+' ('+list.length+')';
    const g=document.createElement('div');g.className='grid';list.slice(0,300).forEach(c=>g.append(card(c,list)));
    h.append(g);app.append(h);focusFirst();return;
  }
  const first=all[0],hero=document.createElement('div');hero.id='hero';
  hero.innerHTML='<img alt=""><div><h2></h2><p></p><button class="btn main"></button></div>';
  const im=hero.querySelector('img');if(first.logo)im.src=first.logo;im.onerror=()=>im.style.display='none';
  const unit=mode==='movies'?'filmes':mode==='series'?'séries':'canais';
  hero.querySelector('h2').textContent=first.name;hero.querySelector('p').textContent=first.group+' · '+all.length+' '+unit;
  const hb=hero.querySelector('button');hb.textContent=mode==='series'?'Ver episódios':'Assistir';hb.onclick=()=>openItem(first,all);app.append(hero);
  groups.forEach((list,name)=>{
    const s=document.createElement('section');s.className='row';
    const h=document.createElement('h3'),b=document.createElement('button');b.textContent=name+'  ›';b.onclick=()=>{view=name;render();scrollTo(0,0)};
    h.append(b);const strip=document.createElement('div');strip.className='strip';
    list.slice(0,40).forEach(c=>strip.append(card(c,list)));s.append(h,strip);app.append(s);
  });
  focusFirst();
}
function renderDetail(app){
  const d=detail,flat=[].concat(...d.seasons.map(x=>x.eps));
  const hero=document.createElement('div');hero.id='hero';
  hero.innerHTML='<img alt=""><div><h2></h2><p></p><button class="btn main">Voltar</button></div>';
  const im=hero.querySelector('img');if(d.logo)im.src=d.logo;im.onerror=()=>im.style.display='none';
  hero.querySelector('h2').textContent=d.name;hero.querySelector('p').textContent=d.seasons.length+' temporada(s) · '+flat.length+' episódios';
  hero.querySelector('button').onclick=()=>{detail=null;render()};app.append(hero);
  d.seasons.forEach(se=>{
    const s=document.createElement('section');s.className='row';
    const h=document.createElement('h3');h.textContent='Temporada '+se.n;
    const strip=document.createElement('div');strip.className='strip';se.eps.forEach(e=>strip.append(card(e,flat)));
    s.append(h,strip);app.append(s);
  });
  focusFirst();
}
async function fetchCats(a){
  const cs=await getJSON(xt.api+'&action='+a),n={};(Array.isArray(cs)?cs:[]).forEach(c=>n[c.category_id]=c.category_name);return n;
}
async function loadVod(){
  loading=true;render();
  try{
    const [n,st]=await Promise.all([fetchCats('get_vod_categories'),getJSON(xt.api+'&action=get_vod_streams')]);
    movies=(Array.isArray(st)?st:[]).map(s=>({kind:'movie',name:s.name||'Sem nome',logo:s.stream_icon||'',group:n[s.category_id]||'Outros',
      url:`${xt.base}/movie/${enc(xt.user)}/${enc(xt.pass)}/${s.stream_id}.${s.container_extension||'mp4'}`}));
  }catch(e){movies=[]}
  loading=false;
}
async function loadSeries(){
  loading=true;render();
  try{
    const [n,st]=await Promise.all([fetchCats('get_series_categories'),getJSON(xt.api+'&action=get_series')]);
    series=(Array.isArray(st)?st:[]).map(s=>({kind:'series',id:s.series_id,name:s.name||'Sem nome',logo:s.cover||'',group:n[s.category_id]||'Outros'}));
  }catch(e){series=[]}
  loading=false;
}
async function openSeries(c){
  loading=true;render();
  try{
    const d=await getJSON(`${xt.api}&action=get_series_info&series_id=${c.id}`);
    const seasons=Object.keys(d.episodes||{}).sort((a,b)=>a-b).map(n=>({n,eps:d.episodes[n].map(e=>({kind:'ep',
      name:('E'+e.episode_num+'. '+(e.title||'')).trim(),logo:(e.info&&e.info.movie_image)||c.logo,
      url:`${xt.base}/series/${enc(xt.user)}/${enc(xt.pass)}/${e.id}.${e.container_extension||'mp4'}`}))}));
    detail=seasons.length?{name:c.name,logo:c.logo,seasons}:null;
  }catch(e){detail=null}
  loading=false;render();
}
async function setMode(m){
  mode=m;view=null;detail=null;
  if(m==='movies'&&!movies)await loadVod();
  if(m==='series'&&!series)await loadSeries();
  render();scrollTo(0,0);
}
$('#tl').onclick=()=>setMode('live');$('#tm').onclick=()=>setMode('movies');$('#ts').onclick=()=>setMode('series');
$('#favbtn').onclick=()=>{favoriteOnly=!favoriteOnly;recentOnly=false;view=null;$('#favbtn').setAttribute('aria-pressed',favoriteOnly);$('#recentbtn').setAttribute('aria-pressed',false);render()};
$('#recentbtn').onclick=()=>{recentOnly=!recentOnly;favoriteOnly=false;view=null;$('#recentbtn').setAttribute('aria-pressed',recentOnly);$('#favbtn').setAttribute('aria-pressed',false);render()};
$('#search').oninput=e=>{query=e.target.value;view=null;render()};
function focusFirst(){if(document.activeElement===$('#search'))return;const e=$('#app .btn, #app .card');if(e)e.focus({preventScroll:true})}

/* ---------- Player ---------- */
function play(list,i,vod){
  if(NATIVE){if(list[i])markRecent(list[i]);const a=Math.max(0,i-250),j=JSON.stringify(list.slice(a,i+250).map(c=>[c.name,c.url]));if(vod&&Android.playVod)Android.playVod(j,i-a);else Android.play(j,i-a);return}
  queue=list;qi=i;start()
}
function start(){
  const c=queue[qi];if(!c)return;markRecent(c);$('#webfav').textContent=isFav(c)?'★ Favorito':'☆ Favorito';
  const v=$('#v');$('#player').classList.add('on');$('#pt').textContent=c.name;
  const m=$('#pmsg');m.style.display='grid';m.textContent='Carregando…';
  if(hls){hls.destroy();hls=null}
  const fail=()=>{m.style.display='grid';m.textContent='Não foi possível reproduzir este canal. Use ↑ ou ↓ para trocar.'};
  v.onplaying=()=>{m.style.display='none'};v.onerror=fail;
  if(window.Hls&&Hls.isSupported()&&/\.m3u8(\?|$)/i.test(c.url)){
    hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v);hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)fail()});
  }else v.src=c.url;
  v.play().catch(()=>{});
  $('#bar').classList.remove('hide');clearTimeout(start.t);start.t=setTimeout(()=>$('#bar').classList.add('hide'),3500);
}
function stop(){
  const v=$('#v');if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');v.load();
  $('#player').classList.remove('on');focusFirst();
}
$('#back').onclick=stop;$('#prevchan').onclick=()=>{qi=(qi-1+queue.length)%queue.length;start()};$('#nextchan').onclick=()=>{qi=(qi+1)%queue.length;start()};$('#webfav').onclick=()=>{const c=queue[qi];if(c)toggleFav(c)};

/* ---------- Controle remoto (setas / Enter / Voltar) ---------- */
document.addEventListener('keydown',e=>{
  const k=e.key,pl=$('#player').classList.contains('on');
  if(['Escape','GoBack','BrowserBack','Backspace'].includes(k)||e.keyCode===4){
    if(NATIVE)return;
    if($('#dlg').open)return;
    if(pl){e.preventDefault();stop()}else if(goBack()){e.preventDefault()}return;
  }
  if(pl){
    if(k==='ArrowUp'){e.preventDefault();qi=(qi-1+queue.length)%queue.length;start()}
    else if(k==='ArrowDown'){e.preventDefault();qi=(qi+1)%queue.length;start()}
    else{$('#bar').classList.remove('hide');clearTimeout(start.t);start.t=setTimeout(()=>$('#bar').classList.add('hide'),3500)}
    return;
  }
  if($('#dlg').open||!k.startsWith('Arrow'))return;
  const el=document.activeElement;
  if(el&&/INPUT|TEXTAREA/.test(el.tagName))return;
  const all=[...document.querySelectorAll('header .btn,#search,#hero .btn,#app .card,#app .favstar,.row h3 button')].filter(o=>o.offsetParent!==null);
  if(!all.length)return;
  if(!all.includes(el)){all[0].focus();e.preventDefault();return}
  const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
  for(const o of all){
    if(o===el)continue;const q=o.getBoundingClientRect(),ox=q.left+q.width/2,oy=q.top+q.height/2,dx=ox-cx,dy=oy-cy;
    let ok,score;
    if(k==='ArrowRight'){ok=dx>4&&Math.abs(dy)<r.height*0.6;score=dx+Math.abs(dy)*3}
    else if(k==='ArrowLeft'){ok=dx<-4&&Math.abs(dy)<r.height*0.6;score=-dx+Math.abs(dy)*3}
    else if(k==='ArrowDown'){ok=dy>8;score=dy+Math.abs(dx)*1.5}
    else{ok=dy<-8;score=-dy+Math.abs(dx)*1.5}
    if(ok&&score<bs){bs=score;best=o}
  }
  e.preventDefault();
  if(best){best.focus({preventScroll:true});best.scrollIntoView({block:'center',inline:'center',behavior:'smooth'})}
});

/* ---------- Diálogo de importação ---------- */
$('#imp').onclick=()=>{$('#err').textContent='';$('#dlg').showModal()};
$('#cx').onclick=()=>$('#dlg').close();
$('#home').onclick=()=>{view=null;detail=null;render();scrollTo(0,0)};
document.querySelectorAll('.tabs .btn').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;document.querySelectorAll('.tabs .btn').forEach(x=>x.setAttribute('aria-pressed',x===b));
  $('#p-m3u').classList.toggle('on',tab==='m3u');$('#p-xt').classList.toggle('on',tab==='xt');
});
$('#go').onclick=async()=>{
  const err=$('#err');err.textContent='Carregando…';
  try{
    let src;
    if(tab==='xt'){
      const server=$('#xs').value,user=$('#xu').value.trim(),pass=$('#xp').value;
      if(!server||!user||!pass)throw new Error('miss');src={type:'xt',server,user,pass};
    }else{
      const f=$('#f').files[0],t=$('#t').value.trim(),u=$('#u').value.trim();
      if(f)src={type:'m3u',text:await f.text()};else if(t)src={type:'m3u',text:t};else if(u)src={type:'m3u',url:u};else throw new Error('miss');
    }
    await importFrom(src);$('#dlg').close();
  }catch(e){
    err.textContent=e.message==='miss'?'Preencha os campos da aba escolhida.':
      e.message==='empty'?'Nenhum canal encontrado. Confira se o conteúdo é uma lista válida.':
      e.message==='auth'?'Usuário ou senha não aceitos pelo servidor.':
      (NATIVE?'Não foi possível conectar. Confira servidor, usuário, senha e a internet.':'Não foi possível carregar. O servidor pode bloquear acesso pelo navegador (CORS): baixe o arquivo M3U e use a opção de arquivo.');
  }
};

/* ---------- Início ---------- */
(async()=>{
  try{const s=JSON.parse(store.get('src')||'null');if(s)await importFrom(s)}catch(e){}
  if(!channels.length)render();
})();
</script>
